// Question generators. make(level, typeFilter) returns a question:
//   { type, ids[], text, staff?, kbPrompt?, answer, hint, explain(), shown, level }
// answer.kind: key | name | place | interval | chord | seq
// ---------------------------------------------------------------------------
const TYPE_LABELS = {
  read: 'Read and play', readName: 'Name the note', locate: 'Find the key', identify: 'Name the key',
  place: 'Place on the staff', steps: 'Landmark steps', seq: 'Sight-reading lines', chord: 'Chords',
  interval: 'Intervals', readKey: 'Key signatures', readKeyName: 'Key signatures: name it',
};

const Questions = (() => {
  const ctxCache = {};
  function ctxFor(L) {
    if (ctxCache[L.id]) return ctxCache[L.id];
    const clefs = levelClefs(L);
    const staff = levelStaff(L);
    const c = {
      L, clefs, staff, keys: L.keys || [],
      grand: clefs.includes('treble') && clefs.includes('bass') && !L.single,
      kb: levelKbRange(L), extent: levelExtent(L), recent: [],
    };
    ctxCache[L.id] = c;
    return c;
  }

  const wpick = (pool, c) => {
    const cand = pool.length > 4 ? pool.filter(e => !c.recent.includes(e.id)) : pool;
    const e = weightedPick(cand.length ? cand : pool, x => Store.weight(x.id) * (x.review ? 0.35 : 1));
    c.recent.push(e.id);
    if (c.recent.length > 3) c.recent.shift();
    return e;
  };

  function staffOpts(c, clefMode, cols, extra) {
    const clefs = clefMode === 'grand' ? ['treble', 'bass'] : [clefMode];
    const extent = {};
    clefs.forEach(k => { if (c.extent[k]) extent[k] = c.extent[k].slice(); });
    return Object.assign({ clef: clefMode, cols, extent }, extra);
  }
  const NAME = n => nameHTML(n);

  // ---- read / readName ----------------------------------------------------------
  function readBase(c, e) {
    const written = e.w || e.n;
    const mode = c.grand ? 'grand' : e.clef;
    const staff = staffOpts(c, mode, [[{ n: written, clef: e.clef }]], e.ott ? { ottava: { text: e.ott, side: e.ott === '8va' ? 'above' : 'below', from: 0, to: 0 } } : {});
    const r = route(written, e.clef, true);
    const rh = route(written, e.clef, false);
    let ex = `The note is ${NAME(e.n)}. ${r.answerHTML}`;
    if (e.ott) ex = `Written ${NAME(written)} with <b>${e.ott}</b>: play it an octave ${e.ott === '8va' ? 'higher' : 'lower'}, which is ${NAME(e.n)}. ` + r.html;
    return { staff, hint: rh.html + (e.ott ? ` The <b>${e.ott}</b> sign moves it an octave ${e.ott === '8va' ? 'up' : 'down'}.` : ''), explain: ex, written, clef: e.clef };
  }
  function qRead(c) {
    const e = wpick(c.staff, c);
    const b = readBase(c, e);
    return {
      type: 'read', ids: [e.id], text: e.ott ? `Play this note. Mind the <b>${e.ott}</b>.` : 'Play this note.',
      staff: b.staff, answer: { kind: 'key', targets: [midiOf(e.n)] }, hint: b.hint, explain: b.explain, shown: e.n, clef: e.clef,
    };
  }
  function qReadName(c) {
    const e = wpick(c.staff, c);
    const b = readBase(c, e);
    const parts = c.L.pad || { letter: true };
    return {
      type: 'readName', ids: [e.id], text: parts.oct ? 'Name this note, with its octave number.' : 'Name this note.',
      staff: b.staff, answer: { kind: 'name', parts, target: e.n, strict: true }, hint: b.hint, explain: b.explain, shown: e.n, clef: e.clef,
    };
  }

  // ---- locate / identify --------------------------------------------------------
  const KEY_TIPS = {
    0: 'C is the white key just <b>left of a pair</b> of black keys.',
    1: 'D sits <b>between the two black keys</b> of a pair.',
    2: 'E is the white key just <b>right of a pair</b>.',
    3: 'F is the white key just <b>left of a triple</b>.',
    4: 'G sits under the gap between the <b>first and second</b> black keys of a triple.',
    5: 'A sits under the gap between the <b>second and third</b> black keys of a triple.',
    6: 'B is the white key just <b>right of a triple</b>.',
  };
  function keyExplain(L, n) {
    if (n.a !== 0) {
      const base = fromStep(stepOf(n), 0);
      return `${NAME(n)} is one key ${n.a > 0 ? 'right' : 'left'} of ${NAME(base)}${Math.abs(n.a) > 1 ? ' (twice)' : ''}.`;
    }
    if (L.id === 2) return `${NAME(n)} is a C. Count the Cs from the left: the number goes up at every C. Middle C is C4.`;
    return KEY_TIPS[n.l];
  }
  function qLocate(c) {
    const L = c.L;
    const e = wpick(c.keys, c);
    const any = !!L.anyOctave;
    const target = e.n;
    const text = any
      ? `Find any <b>${LETTERS[target.l]}</b> on the keyboard.`
      : `Find <b>${NAME(target)}</b>${target.a === 0 && stepOf(target) === 28 ? ' (Middle C)' : ''}.`;
    const pcOf = n => ((midiOf(n) % 12) + 12) % 12;
    return {
      type: 'locate', ids: [e.id], text,
      answer: { kind: 'key', targets: any ? null : [midiOf(target)], accept: any ? (m => ((m % 12) + 12) % 12 === pcOf(target)) : null, anyTarget: midiOf(target) },
      hint: any ? KEY_TIPS[target.l] : keyExplain(L, target), explain: keyExplain(L, target), shown: target,
    };
  }
  function qIdentify(c) {
    const L = c.L;
    const e = wpick(c.keys, c);
    const parts = L.pad || { letter: true };
    return {
      type: 'identify', ids: [e.id], text: parts.fixedLetter ? 'Which octave is this C?' : 'What is the name of the highlighted key?',
      kbPrompt: { target: midiOf(e.n) },
      answer: { kind: 'name', parts, target: e.n, strict: !L.anySpelling && !L.anyOctave, anyOctave: !!L.anyOctave, anySpelling: !!L.anySpelling },
      hint: keyExplain(L, e.n), explain: `The key is ${NAME(e.n)}. ` + keyExplain(L, e.n), shown: e.n,
    };
  }

  // ---- place on staff -----------------------------------------------------------
  function qPlace(c) {
    const nat = c.staff.filter(e => e.n.a === 0 && !e.ott);
    if (!nat.length) return null;
    const e = wpick(nat, c);
    const clef = e.clef;
    const r = route(e.n, clef, true);
    return {
      type: 'place', ids: [e.id], text: `Where does this key go on the <b>${CLEFS[clef].title.toLowerCase()}</b>? Tap the line or space.`,
      kbPrompt: { target: midiOf(e.n) },
      staff: staffOpts(c, clef, [], {}),
      answer: { kind: 'place', clef, targetPos: posOf(e.n, clef), n: e.n },
      hint: r.html, explain: `The key is ${NAME(e.n)}. ${r.answerHTML}`, shown: e.n, clef,
    };
  }

  // ---- landmark steps -----------------------------------------------------------
  function qSteps(c) {
    const L = c.L;
    if (!L.steps) return null;
    const lmName = wpick(L.steps.from.map(n => ({ id: 'lm:' + n, n })), c).n;
    const lm = LM[lmName];
    const homes = lm.tags.filter(t => c.clefs.includes(t));
    const clef = homes.length ? pick(homes) : lm.tags[0];
    let k = 1 + rnd(L.steps.max), dir = Math.random() < 0.5 ? 1 : -1;
    const inRange = d => { const m = midiOf(fromStep(lm.step + d * k)); return m >= c.kb[0] && m <= c.kb[1]; };
    if (!inRange(dir)) dir = -dir;
    if (!inRange(dir)) k = 1;
    const target = fromStep(lm.step + dir * k);
    const dirTxt = dir > 0 ? 'up' : 'down';
    const letters = [];
    for (let i = 0; i <= k; i++) letters.push(LETTERS[fromStep(lm.step + dir * i).l]);
    const ext = {};
    ext[clef] = (c.extent[clef] || [0, 8]).slice();
    const tp = posOf(target, clef);
    ext[clef][0] = Math.min(ext[clef][0], tp - 1); ext[clef][1] = Math.max(ext[clef][1], tp + 1);
    return {
      type: 'steps', ids: ['st:' + lm.n + (dir > 0 ? '+' : '-') + k], text: `Start on <b>${lm.name}</b> and go <b>${stepPhrase(k, dirTxt)}</b>. Which key is that?`,
      staff: { clef, cols: [[{ n: lm.note, clef, state: 'lm', label: lm.name }]], extent: ext, targetNote: target },
      answer: { kind: 'key', targets: [midiOf(target)] },
      hint: `Say the letters as you move ${dirTxt}: ${letters.join(', ')}...`,
      explain: `${lm.name} (${NAME(lm.note)}), ${stepPhrase(k, dirTxt)}: ${letters.join(' → ')}. That is ${NAME(target)}.`,
      shown: target, clef,
    };
  }

  // ---- key signatures -----------------------------------------------------------
  const KS_RANGE = { treble: ['D4', 'G5'], bass: ['F2', 'B3'] };
  const keyWords = n => {
    const ls = n > 0 ? SHARP_ORDER.slice(0, n) : FLAT_ORDER.slice(0, -n);
    return ls.map(l => LETTERS[l] + (n > 0 ? '♯' : '♭')).join(', ');
  };
  function qReadKey(c, nameIt) {
    const L = c.L;
    const keys = L.keySigs || [1, 2, 3, -1, -2, -3];
    const clefs = (L.staffClefs || c.clefs).filter(x => KS_RANGE[x]);
    const clef = pick(clefs);
    const items = [];
    keys.forEach(k => items.push({ id: `ks:${k}:${clef}`, k }));
    const it = wpick(items, c);
    const km = keyAccs(it.k);
    const altered = Object.keys(km).map(Number);
    const [lo, hi] = KS_RANGE[clef].map(s => stepOf(parseNote(s)));
    let step;
    if (altered.length && Math.random() < 0.7) {
      const cand = [];
      for (let s = lo; s <= hi; s++) if (altered.includes(((s % 7) + 7) % 7)) cand.push(s);
      step = pick(cand);
    } else step = lo + rnd(hi - lo + 1);
    const base = fromStep(step);
    const n = writtenInKey(base.l, base.o, it.k);
    const sound = mk(n.l, n.o, n.a);
    const changed = n.a !== 0;
    const ex = `${KEYS[it.k]} has ${keyWords(it.k)}. ` + (changed ? `Every ${LETTERS[n.l]} is altered, so this is ${NAME(sound)}.` : `${LETTERS[n.l]} is not in the signature, so it stays natural: ${NAME(sound)}.`);
    return {
      type: nameIt ? 'readKeyName' : 'readKey', ids: [it.id], text: nameIt ? 'Name the note that sounds. Check the key signature first.' : 'Play this note. Check the key signature first.',
      staff: staffOpts(c, clef, [[{ n, clef }]], { keySig: it.k }),
      answer: nameIt ? { kind: 'name', parts: L.pad || { letter: true, acc: [-1, 0, 1] }, target: sound, strict: true, ignoreOct: true } : { kind: 'key', targets: [midiOf(sound)] },
      hint: `Key signature: ${keyWords(it.k) || 'none'}. Say these letters before you play.`, explain: ex, shown: sound, clef,
    };
  }

  // ---- sight-reading line -------------------------------------------------------
  function qSeq(c) {
    const L = c.L;
    const clef = pick(c.clefs);
    const keyN = L.seqKeys ? pick(L.seqKeys) : 0;
    let base = c.staff.filter(e => e.clef === clef && !e.ott);
    if (L.seqKeys) base = base.filter(e => e.n.a === 0);
    const seen = new Set();
    base = base.filter(e => { const k = stepOf(e.n) * 10 + e.n.a; if (seen.has(k)) return false; seen.add(k); return true; })
      .sort((a, b) => stepOf(a.n) - stepOf(b.n) || a.n.a - b.n.a);
    if (base.length < 4) return null;
    const len = L.seqLen || 5;
    const win = Math.min(base.length, 10);
    const w0 = rnd(base.length - win + 1);
    let idx = w0 + rnd(win);
    const picks = [];
    for (let i = 0; i < len; i++) {
      picks.push(base[idx]);
      let d = pick([-2, -1, -1, 1, 1, 2, 0 + (Math.random() < 0.15 ? 3 : 1), -1]);
      let ni = idx + d;
      if (ni < w0 || ni >= w0 + win || ni === idx) ni = idx + (idx - w0 > win / 2 ? -1 : 1);
      idx = clamp(ni, w0, w0 + win - 1);
    }
    const notes = picks.map(e => (L.seqKeys ? writtenInKey(e.n.l, e.n.o, keyN) : e.n));
    const sounding = notes.map(n => mk(n.l, n.o, n.a));
    return {
      type: 'seq', ids: sounding.map(n => `${clef}:${ascii(n)}`), text: `Play this line, one note at a time${keyN ? '. Check the key signature first' : ''}.`,
      staff: staffOpts(c, clef, notes.map(n => [{ n, clef }]), { keySig: keyN, colW: 46 }),
      answer: { kind: 'seq', targets: sounding.map(midiOf), notes: sounding },
      hint: `Find a landmark in the first bar, then follow the steps and skips.${keyN ? ' Key: ' + keyWords(keyN) + '.' : ''}`,
      explain: sounding.map(NAME).join(' '), shown: sounding[0], clef,
    };
  }

  // ---- intervals ----------------------------------------------------------------
  const IV = ['2nd', '3rd', '4th', '5th', '6th', '7th', 'octave'];
  function qInterval(c) {
    const clef = pick(c.clefs.filter(x => x === 'treble' || x === 'bass'));
    const item = wpick(IV.map(n => ({ id: 'int:' + n, k: IV.indexOf(n) + 1 })), c);
    const k = item.k;
    const lowPos = -1 + rnd(12 - k);
    const lo = noteAtPos(lowPos, clef), hi = noteAtPos(lowPos + k, clef);
    const letters = []; for (let i = 0; i <= k; i++) letters.push(LETTERS[fromStep(stepOf(lo) + i).l]);
    return {
      type: 'interval', ids: [item.id], text: 'What is the interval between these two notes?',
      staff: staffOpts(c, clef, [[{ n: lo, clef }, { n: hi, clef }]], {}),
      answer: { kind: 'interval', correct: k, options: IV },
      hint: 'Count every line and space from the lower note to the upper note, counting both ends.',
      explain: `${letters.join(' ')}: ${k + 1} letters, so it is ${k === 7 ? 'an' : 'a'} <b>${IV[k - 1]}</b>.`, shown: hi, clef,
    };
  }

  // ---- chords -------------------------------------------------------------------
  const SHAPES = { root: [0, 2, 4], '1st': [2, 4, 7], '2nd': [4, 7, 9] };
  const SHAPE_NAME = { root: 'root position', '1st': 'first inversion', '2nd': 'second inversion' };
  function qChord(c) {
    const L = c.L;
    const clefs = c.clefs.filter(x => x === 'treble' || x === 'bass');
    const clef = pick(clefs);
    const shapes = L.shapes || ['root', '1st', '2nd'];
    const item = wpick(shapes.flatMap(s => clefs.map(cl => ({ id: `ch:${s}:${cl}`, s, cl }))).filter(x => x.cl === clef), c);
    const offs = SHAPES[item.s];
    const r = -1 - Math.min(...offs) + rnd(13 - Math.max(...offs) + Math.min(...offs));
    const keyN = L.seqKeys && Math.random() < 0.4 ? pick(L.seqKeys) : 0;
    const notes = offs.map(o => { const base = noteAtPos(r + o, clef); return writtenInKey(base.l, base.o, keyN); });
    const snd = notes.map(n => mk(n.l, n.o, n.a));
    const rootNote = snd[item.s === 'root' ? 0 : item.s === '1st' ? 2 : 1];
    return {
      type: 'chord', ids: [item.id], text: `Play all the notes of this chord (${SHAPE_NAME[item.s]}). Tap each key.`,
      staff: staffOpts(c, clef, [notes.map(n => ({ n, clef }))], { keySig: keyN }),
      answer: { kind: 'chord', targets: snd.map(midiOf), notes: snd },
      hint: item.s === 'root' ? 'Three lines or three spaces stacked: the bottom note is the root.' : 'Find the biggest gap (a 4th). The upper note of that gap is the root.',
      explain: `${snd.map(NAME).join(' ')}. Root: ${NAME(rootNote)}, ${SHAPE_NAME[item.s]}.`, shown: snd[0], clef,
    };
  }

  const BUILDERS = {
    read: qRead, readName: qReadName, locate: qLocate, identify: qIdentify, place: qPlace, steps: qSteps,
    seq: qSeq, interval: qInterval, chord: qChord, readKey: c => qReadKey(c, false), readKeyName: c => qReadKey(c, true),
  };

  function typesFor(L) { return Object.keys(L.types).filter(t => !(t === 'steps' && !L.steps)); }

  function make(L, filter) {
    const c = ctxFor(L);
    const avail = typesFor(L).filter(t => !filter || filter === 'mixed' || t === filter);
    const types = avail.length ? avail : typesFor(L);
    for (let tries = 0; tries < 8; tries++) {
      const t = weightedPick(types, x => L.types[x]);
      const q = BUILDERS[t](c);
      if (q) { q.level = L; q.ctx = c; return q; }
    }
    const q = BUILDERS[types[0]](c);
    q.level = L; q.ctx = c;
    return q;
  }
  const reset = () => Object.keys(ctxCache).forEach(k => delete ctxCache[k]);
  return { make, typesFor, ctxFor, reset };
})();

/* ---- ui-core.js ---- */
// ---------------------------------------------------------------------------
// UI core: helpers, navigation, settings, Learn path, lessons, drill setup.
// ---------------------------------------------------------------------------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const VIEW = $('#view');
const pad2 = n => String(n).padStart(2, '0');
const mm = ms => Math.round(ms / 100) / 10;

let S = null; // active drill session (see ui-drill.js)
let tab = 'learn';

const star = on => `<svg class="star${on ? ' on' : ''}" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.8l2.4 5.3 5.8.6-4.3 3.9 1.2 5.7L10 14.4 4.9 17.3l1.2-5.7L1.8 7.7l5.8-.6z"/></svg>`;
const stars = n => `<span class="stars" role="img" aria-label="${n} of 3 stars">${[0, 1, 2].map(i => star(i < n)).join('')}</span>`;
const pct = v => Math.round(v * 100);

// ---- interactive machines (Anatomy figures) -----------------------------------------
const FIGURE = { rail: FigLandmarkRail, action: FigKeyAction };
function isoTheme() {
  const t = Store.setting('theme');
  return t === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
}
function syncIso() { $$('.iso').forEach(el => el.setAttribute('data-theme', isoTheme())); }
function mountFigure(host, name) {
  const fig = FIGURE[name];
  host.innerHTML = `<div class="iso fig" data-theme="${isoTheme()}">${fig.card}</div>`;
  fig.mount($('.iso-figure', host));
}

// ---- viz helpers (lessons and hero) -------------------------------------------
function parseShort(s) {
  const m = /^([A-G](?:bb|b|#|x|)-?\d)(n?)(?:@(\w+))?(?:!(\w+))?(?:\|(.*))?$/.exec(s);
  if (!m) throw new Error('bad viz note ' + s);
  const n = parseNote(m[1]);
  if (m[2]) n.nat = true;
  return { n, clef: m[3], state: m[4], label: m[5] };
}
function vizCols(notes) {
  return notes.map(x => (Array.isArray(x) ? x : [x]).map(parseShort));
}
function renderViz(host, viz) {
  host.innerHTML = '';
  if (viz.figure) {
    const d = document.createElement('div');
    host.appendChild(d);
    mountFigure(d, viz.figure);
  }
  if (viz.staff) {
    const d = document.createElement('div');
    host.appendChild(d);
    const o = viz.staff;
    Staff.mount(d, {
      clef: o.clef, cols: vizCols(o.notes || []), guides: o.guides, keySig: o.keySig, ottava: o.ottava,
      colW: (o.notes || []).length > 3 ? 48 : 60, scale: 1.45, aria: 'Lesson diagram',
    });
  }
  if (viz.kb) {
    const d = document.createElement('div');
    d.className = 'viz-kb';
    host.appendChild(d);
    const k = viz.kb;
    const kb = Keyboard.mount(d, {
      lo: midiOf(parseNote(k.lo)), hi: midiOf(parseNote(k.hi)), labels: k.labels, groups: k.groups,
      onPress: m => Sound.play(m), minKey: 26, maxKey: 52,
    });
    Object.entries(k.marks || {}).forEach(([nm, st]) => kb.mark(midiOf(parseNote(nm)), st));
    if (midiOf(parseNote(k.hi)) - midiOf(parseNote(k.lo)) > 40) kb.scrollTo(60);
  }
}

// ---- navigation ------------------------------------------------------------------
const TABS = ['learn', 'drill', 'explore', 'progress'];
function setNav() {
  $$('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
}
function go(t) {
  stopSession(true);
  tab = t;
  setNav();
  if (location.hash.slice(1) !== t) history.replaceState(null, '', '#' + t);

}

// ---- settings ----------------------------------------------------------------------
function applyTheme() {

  syncIso();
}

}
function renderSettings() {
  const st = Store.setting.bind(Store);
  $('#sheet-body').innerHTML = `
    <div class="set-row"><div><b>Sound</b><small>Play the note when you press a key.</small></div>${seg('sound', [[true, 'On'], [false, 'Off']], st('sound'))}</div>

    <div class="set-row"><div><b>Keyboard labels</b><small>Auto marks landmark keys when guides are on.</small></div>${seg('keyLabels', [['auto', 'Auto'], ['none', 'None'], ['landmarks', 'Landmarks'], ['all', 'All']], st('keyLabels'))}</div>
    <div class="set-row"><div><b>Hints</b><small>Show a Hint button. Hinted answers do not raise mastery.</small></div>${seg('hints', [[true, 'On'], [false, 'Off']], st('hints'))}</div>

    <div class="set-row"><div><b>Theme</b></div>${seg('theme', [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']], st('theme'))}</div>
    <div class="set-row"><div><b>MIDI keyboard</b><small id="midi-msg">Play the drills on a real keyboard. Needs Chrome or Edge.</small></div><button type="button" class="btn small" id="midi-btn">Connect</button></div>`;
}
function openSheet() { renderSettings(); $('#sheet').hidden = false; $('#sheet .sheet-x').focus(); }
function closeSheet() { $('#sheet').hidden = true; }
function initSettings() {
  $('#btn-settings').addEventListener('click', openSheet);
  $('#sheet').addEventListener('click', e => {
    if (e.target.id === 'sheet' || e.target.closest('.sheet-x')) return closeSheet();
    const b = e.target.closest('[data-set]');
    if (b) {
      let v = b.dataset.v;
      if (v === 'true') v = true; else if (v === 'false') v = false; else if (/^\d+$/.test(v)) v = +v;
      Store.setSetting(b.dataset.set, v);
      applySettings();
      renderSettings();
      return;
    }
    if (e.target.id === 'midi-btn') {
      Sound.connectMIDI(m => App.onKey(m, true)).then(r => { $('#midi-msg').textContent = r.msg; });
    }
  });
  $('#sheet').addEventListener('input', e => { if (e.target.id === 'vol') { Store.setSetting('volume', +e.target.value); Sound.setVolume(+e.target.value); } });
  $('#btn-sound').addEventListener('click', () => { Store.setSetting('sound', !Store.setting('sound')); applySettings(); });
}
function applySettings() {
  Sound.enabled = Store.setting('sound');
  Sound.setVolume(Store.setting('volume'));
  const on = Sound.enabled;
  const b = $('#btn-sound');
  b.setAttribute('aria-pressed', String(on));
  b.setAttribute('aria-label', on ? 'Sound on' : 'Sound off');

function heroStaff(active) {

function viewLearn() {

    <section class="machine"><div class="machine-copy"><p class="eyebrow">See it work</p><h2>The landmark rail</h2>

/* ---- ui-drill.js ---- */
// ---------------------------------------------------------------------------
// Drill sessions: question rendering, answer handling, feedback and summary.
// ---------------------------------------------------------------------------
const ACC_PLAIN = { '-2': '♭♭', '-1': '♭', '0': '', '1': '♯', '2': '×' };
const plainName = n => LETTERS[n.l] + ACC_PLAIN[n.a] + n.o;
const NM = n => nameHTML(n);

function pickSmartLevel() {
  const started = LEVELS.filter(L => !L.capstone && levelStarted(L) && levelMastery(L) < 0.98);
  const rec = LEVELS.find(L => !L.capstone && levelMastery(L) < 0.6);
  if (rec && !started.includes(rec)) started.push(rec);
  if (!started.length) return LEVELS[0];
  return weightedPick(started, L => 1.1 - levelMastery(L));
}

function stopSession() {
  if (S) { clearInterval(S.timer); clearTimeout(S.adv); }
  S = null;
}

function startSession(o) {
  stopSession();
  const smart = o.level === 'smart';
  S = {
    smart, L: smart ? null : LEVEL[o.level], mode: o.mode || 'steady', filter: o.filter || 'mixed',
    total: Store.setting('length'), i: 0, correct: 0, streak: 0, best: 0, times: [], missed: [],
    answered: false, hinted: false, q: null, guideUser: null, kbMarks: {}, cols: null, sel: null, seq: null,
    timer: null, left: 60, kb: null,
  };
  tab = 'drill'; setNav();
  renderShell();
  if (S.mode === 'speed') {
    S.timer = setInterval(() => {
      if (!S) return;
      S.left -= 0.25;
      updateHead();
      if (S.left <= 0) endSession();
    }, 250);
  }
  nextQuestion();
  window.scrollTo(0, 0);
}

function renderShell() {
  VIEW.innerHTML = `<div class="wrap narrow drill">
    <div class="d-head">
      <button class="btn ghost small" id="d-exit">‹ Exit</button>
      <div class="d-title" id="d-title"></div>
      <div class="d-stats"><span id="d-count"></span><span id="d-streak"></span></div>
    </div>
    <div class="progress" role="progressbar" aria-label="Round progress"><i id="d-bar"></i></div>
    <section class="card prompt">
      <div class="q-top">
        <p id="q-text" class="q-text"></p>
        <div class="q-tools"><button class="btn small ghost" id="b-hint" title="Shortcut: H">Hint</button><button class="btn small ghost" id="b-guides" aria-pressed="false" title="Shortcut: L">Guides</button></div>
      </div>
      <div id="stage" class="stage"></div>
      <div id="fb" class="fb" aria-live="polite"></div>

  </div>`;
  $('#d-exit').onclick = () => go('drill');

  $('#b-next').onclick = nextQuestion;
  $('#ans').onclick = ansClick;
}

function updateHead() {
  if (!S) return;
  const L = S.q ? S.q.level : S.L;
  $('#d-title').textContent = (S.smart ? 'Smart review · ' : '') + (L ? `Level ${pad2(L.id)} · ${L.title}` : '');
  if (S.mode === 'speed') {

    $('#d-bar').style.width = Math.max(0, S.left / 60 * 100) + '%';
  } else {
    $('#d-count').textContent = `${Math.min(S.i + (S.answered ? 0 : 1), S.total)} of ${S.total}`;

  }
  $('#d-streak').textContent = S.streak > 1 ? `Streak ${S.streak}` : '';
}
function updateTools() {
  const q = S.q;
  const hint = $('#b-hint'), g = $('#b-guides');
  hint.hidden = !Store.setting('hints') || S.answered;
  const hasStaff = !!q.staff;
  g.hidden = !hasStaff;
  g.setAttribute('aria-pressed', String(!!S.guides));
  g.textContent = S.guides ? 'Guides on' : 'Guides off';
}

function guidesFor(L) {
  if (S.guideUser !== null) return S.guideUser;
  const g = Store.setting('guides');
  return g === 'on' ? true : g === 'off' ? false : L.tier === 0;
}
function kbLabelMode(q) {
  const k = Store.setting('keyLabels');
  if (k !== 'auto') return k;
  if (q.type === 'locate' || q.type === 'identify') return 'none';
  return S.guides ? 'landmarks' : 'none';
}

// ---- question flow ----------------------------------------------------------------------
function nextQuestion() {
  if (!S) return;
  clearTimeout(S.adv);
  if (S.mode === 'steady' && S.i >= S.total) return endSession();
  const L = S.smart ? pickSmartLevel() : S.L;
  S.q = Questions.make(L, S.filter);
  S.answered = false; S.hinted = false; S.kbMarks = {}; S.cols = null; S.seq = null; S.placeCols = null;
  S.sel = { letter: null, acc: 0, oct: null, chord: new Set() };
  S.guides = guidesFor(L);
  $('#fb').className = 'fb'; $('#fb').innerHTML = '';
  $('#b-next').hidden = true;
  $('#q-text').innerHTML = S.q.text;
  $('#q-text').classList.toggle('big', S.q.type === 'locate');
  if (S.q.answer.kind === 'seq') { S.seq = { i: 0, mistakes: 0, bad: S.q.answer.targets.map(() => false), wrongOn: 0 }; setSeqCols(0); }
  mountStage();
  mountAnswer();
  updateHead(); updateTools();
  S.t0 = performance.now();
}

function stageStaffOpts() {
  const q = S.q;
  const o = Object.assign({}, q.staff, { guides: S.guides, scale: 1.55, aria: 'Notation for this question' });
  if (S.cols) o.cols = S.cols;
  return o;
}
function mountKbPrompt(host) {
  const q = S.q;
  const kb = Keyboard.mount(host, { lo: q.ctx.kb[0], hi: q.ctx.kb[1], labels: kbLabelMode(q), onPress: m => App.onKey(m) });
  kb.mark(q.kbPrompt.target, S.answered ? 'good' : 'target');
  kb.scrollTo(q.kbPrompt.target);
  return kb;
}
function mountStage() {
  const q = S.q, stage = $('#stage');
  stage.innerHTML = '';
  stage.hidden = false;
  if (q.kbPrompt) { mountKbPrompt(stage); return; }
  if (q.staff && q.answer.kind !== 'place') { Staff.mount(stage, stageStaffOpts()); return; }
  stage.hidden = true;
}
function applyMarks() {
  if (!S.kb) return;
  S.kb.clear();
  Object.entries(S.kbMarks).forEach(([m, st]) => S.kb.mark(+m, st));
}
function mountAnswer() {
  const q = S.q, a = q.answer, ans = $('#ans');
  S.kb = null;
  if (a.kind === 'key' || a.kind === 'seq' || a.kind === 'chord') {
    const [lo, hi] = q.ctx.kb;
    ans.innerHTML = '<div id="kbhost"></div>';
    S.kb = Keyboard.mount($('#kbhost'), { lo, hi, labels: kbLabelMode(q), onPress: m => App.onKey(m) });
    const mid = Math.round((lo + hi) / 2);
    if (hi - lo > 40) {
      ans.insertAdjacentHTML('beforeend', '<div class="kb-nav"><button class="btn small ghost" data-kbnav="-1">‹ Lower keys</button><button class="btn small ghost" data-kbnav="1">Higher keys ›</button></div>');
      S.kb.scrollTo(60);
    } else S.kb.scrollTo(mid);
    applyMarks();
  } else if (a.kind === 'name') mountPad();
  else if (a.kind === 'interval') {
    ans.innerHTML = `<div class="pad"><div class="pad-row opts">${a.options.map((o, i) => `<button class="pbtn wide" data-iv="${i + 1}">${o}</button>`).join('')}</div></div>`;
  } else if (a.kind === 'place') mountPlace();
}
function mountPlace(cols) {
  const q = S.q;
  const o = Object.assign({}, q.staff, { guides: S.guides, scale: 1.55, aria: 'Tap the line or space' });
  if (cols) o.cols = cols; else o.onPick = onPlace;
  Staff.mount($('#ans'), o);
}
function refreshStage() {
  if (!S || !S.q) return;
  mountStage();
  if (S.q.answer.kind === 'place') mountPlace(S.placeCols);
  else if (S.kb) { const sc = S.kb.scroller.scrollLeft; mountAnswer(); S.kb.scroller.scrollLeft = sc; }
  updateTools();
}

// ---- name pad ---------------------------------------------------------------------------
function mountPad() {
  const q = S.q, a = q.answer, p = a.parts;
  const lo = Math.floor(q.ctx.kb[0] / 12) - 1, hi = Math.floor(q.ctx.kb[1] / 12) - 1;
  let html = '<div class="pad">';
  if (p.fixedLetter) html += `<p class="pad-note">This key is a <b>${p.fixedLetter}</b>.</p>`;
  else html += `<div class="pad-row" role="group" aria-label="Letter">${LETTERS.map((l, i) => `<button class="pbtn" data-l="${i}" aria-pressed="false">${l}</button>`).join('')}</div>`;
  if (p.acc) html += `<div class="pad-row" role="group" aria-label="Accidental">${p.acc.map(x => `<button class="pbtn acc${x === 0 ? ' on' : ''}" data-a="${x}" aria-pressed="${x === 0}" aria-label="${x === 0 ? 'natural' : ACC_WORDS[x]}">${accSvg(x)}</button>`).join('')}</div>`;
  if (p.oct) {
    let os = ''; for (let o = lo; o <= hi; o++) os += `<button class="pbtn" data-o="${o}" aria-pressed="false">${o}</button>`;
    html += `<div class="pad-row" role="group" aria-label="Octave number"><span class="pad-lbl">Octave</span>${os}</div>`;
  }
  const needCheck = !((p.fixedLetter ? 0 : 1) + (p.acc ? 1 : 0) + (p.oct ? 1 : 0) === 1);
  if (needCheck) html += '<div class="pad-row"><button class="btn primary" id="pad-check" disabled>Check</button><span class="pad-sel muted" id="pad-sel"></span></div>';
  html += '</div>';
  $('#ans').innerHTML = html;
}
function padSummary() {
  const p = S.q.answer.parts, s = S.sel;
  const l = p.fixedLetter ? LETTERS.indexOf(p.fixedLetter) : s.letter;
  const txt = (l === null ? '?' : LETTERS[l]) + (p.acc && s.acc ? ACC_PLAIN[s.acc] : '') + (p.oct ? (s.oct === null ? '?' : s.oct) : '');
  const sel = $('#pad-sel'), chk = $('#pad-check');
  if (sel) sel.textContent = txt;
  if (chk) chk.disabled = l === null || (p.oct && s.oct === null);
}
function setPad(kind, v) {
  if (S.answered) return;
  const p = S.q.answer.parts;
  if (kind === 'l') S.sel.letter = v; if (kind === 'a') S.sel.acc = v; if (kind === 'o') S.sel.oct = v;
  $$('#ans [data-' + kind + ']').forEach(b => { const on = +b.dataset[kind] === v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
  const only = (p.fixedLetter ? 0 : 1) + (p.acc ? 1 : 0) + (p.oct ? 1 : 0) === 1;
  if (only && (kind === 'l' || kind === 'o')) return checkName();
  padSummary();
}
function checkName() {
  if (S.answered) return;
  const a = S.q.answer, p = a.parts, s = S.sel, t = a.target;
  const letter = p.fixedLetter ? LETTERS.indexOf(p.fixedLetter) : s.letter;
  if (letter === null || (p.oct && s.oct === null)) return;
  const acc = p.acc ? s.acc : 0;
  let ok;
  if (a.anyOctave) ok = letter === t.l;
  else if (a.anySpelling) {
    ok = p.oct ? midiOf(mk(letter, s.oct, acc)) === midiOf(t) : ((PCS[letter] + acc + 120) % 12) === ((midiOf(t) % 12) + 12) % 12;
  } else ok = letter === t.l && acc === t.a && (!p.oct || a.ignoreOct || s.oct === t.o);
  const said = LETTERS[letter] + ACC_PLAIN[acc] + (p.oct ? s.oct : '');
  revealStaff(ok);
  finish(ok, ok ? '' : `You answered ${said}.`);
}

// ---- other answers -----------------------------------------------------------------------
function ansClick(e) {
  if (!S) return;
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.kbnav) return S.kb.scrollBy(+t.dataset.kbnav);
  if (t.dataset.l !== undefined) return setPad('l', +t.dataset.l);
  if (t.dataset.a !== undefined) return setPad('a', +t.dataset.a);
  if (t.dataset.o !== undefined) return setPad('o', +t.dataset.o);
  if (t.id === 'pad-check') return checkName();
  if (t.dataset.iv) {
    if (S.answered) return;
    const k = +t.dataset.iv, ok = k === S.q.answer.correct;
    t.classList.add(ok ? 'good' : 'bad');
    if (!ok) $$('#ans [data-iv]')[S.q.answer.correct - 1].classList.add('good');
    revealStaff(ok);
    finish(ok, ok ? '' : `You answered ${S.q.answer.options[k - 1]}.`);
  }
}
function onPlace(pos, clef) {
  if (S.answered || clef !== S.q.answer.clef) return;
  const a = S.q.answer, ok = pos === a.targetPos;
  const picked = noteAtPos(pos, clef);
  Sound.play(midiOf(picked));
  S.placeCols = ok
    ? [[{ n: a.n, clef, state: 'good', label: plainName(a.n) }]]
    : [[{ n: picked, clef, state: 'bad', label: plainName(picked) }], [{ n: a.n, clef, state: 'lm', label: plainName(a.n) }]];
  mountPlace(S.placeCols);
  finish(ok, ok ? '' : `You placed ${NM(picked)}.`);
}
function keyOk(m) { const a = S.q.answer; return a.accept ? a.accept(m) : a.targets.includes(m); }
function handleKey(m) {
  Sound.play(m);
  if (S.answered) return;
  const a = S.q.answer;
  if (a.kind === 'key') {
    const ok = keyOk(m);
    S.kbMarks[m] = ok ? 'good' : 'bad';
    if (!ok) (a.targets || [a.anyTarget]).forEach(t => (S.kbMarks[t] = 'good'));
    applyMarks();
    revealStaff(ok);
    finish(ok, ok ? '' : `You played ${NM(noteFromMidi(m))}.`);
  } else if (a.kind === 'seq') seqPress(m);
  else if (a.kind === 'chord') chordPress(m);
}
function seqPress(m) {
  const q = S.q, a = q.answer;
  if (!S.seq) S.seq = { i: 0, mistakes: 0, bad: a.targets.map(() => false), wrongOn: 0 };
  const sq = S.seq, exp = a.targets[sq.i];
  if (m === exp) {
    sq.i++; sq.wrongOn = 0;
    S.kbMarks = {};
    if (sq.i >= a.targets.length) {
      setSeqCols(-1);
      applyMarks();
      const ms = performance.now() - S.t0;
      q.ids.forEach((id, k) => Store.rec(id, !sq.bad[k], ms / q.ids.length, S.hinted));
      return finish(sq.mistakes === 0, sq.mistakes ? `You had ${sq.mistakes} wrong ${sq.mistakes === 1 ? 'note' : 'notes'}. The line was ${q.explain}.` : '', true);
    }
    setSeqCols(sq.i);
  } else {
    sq.mistakes++; sq.bad[sq.i] = true; sq.wrongOn++;
    S.kbMarks = { [m]: 'bad' };
    if (sq.wrongOn >= 2) S.kbMarks[exp] = 'target';
    setSeqCols(sq.i);
    setTimeout(() => { if (S && S.seq === sq && S.kbMarks[m] === 'bad') { delete S.kbMarks[m]; applyMarks(); } }, 450);
  }
  applyMarks();
}
function setSeqCols(cur) {
  const q = S.q, notes = q.staff.cols.map(c => c[0].n);
  S.cols = notes.map((n, i) => [{ n, clef: q.staff.cols[i][0].clef, state: i < (cur < 0 ? 99 : cur) ? (S.seq.bad[i] ? 'bad' : 'good') : i === cur ? 'target' : 'ink', label: i < (cur < 0 ? 99 : cur) ? plainName(q.answer.notes[i]) : '' }]);
  mountStage();
}
function chordPress(m) {
  const a = S.q.answer, set = S.sel.chord;
  if (set.has(m)) set.delete(m); else set.add(m);
  S.kbMarks = {};
  set.forEach(x => (S.kbMarks[x] = 'sel'));
  applyMarks();
  if (set.size < a.targets.length) return;
  const ok = [...set].sort().join() === a.targets.slice().sort((x, y) => x - y).join();
  S.kbMarks = {};
  a.targets.forEach(t => (S.kbMarks[t] = 'good'));
  set.forEach(x => { if (!a.targets.includes(x)) S.kbMarks[x] = 'bad'; });
  applyMarks();
  revealStaff(ok);
  finish(ok, ok ? '' : `You played ${[...set].sort((x, y) => x - y).map(x => NM(noteFromMidi(x))).join(' ')}.`);
}
/** Recolour the staff note(s) once the answer is known and name them underneath. */
function revealStaff(ok) {
  const q = S.q;
  if (!q.staff || q.answer.kind === 'place') return;
  const cols = q.staff.cols.map(c => c.map(it => Object.assign({}, it, q.type === 'steps' ? {} : { state: ok ? 'good' : 'lm' })));
  if (q.type === 'steps') {
    cols.push([{ n: q.staff.targetNote, clef: q.staff.cols[0][0].clef, state: ok ? 'good' : 'target', label: plainName(q.staff.targetNote) }]);
  } else if (q.type === 'chord') {
    cols[0].forEach((it, i) => (it.label = ''));
  } else if (q.type !== 'interval' && cols.length === 1 && cols[0].length === 1) {
    cols[0][0].label = plainName(q.shown);
  }
  S.cols = cols;
  mountStage();
}

// ---- feedback -------------------------------------------------------------------------------
function showHint() {
  if (!S || S.answered || !Store.setting('hints')) return;
  S.hinted = true;
  const fb = $('#fb');
  fb.className = 'fb hint';
  fb.innerHTML = `<b>Hint.</b> ${S.q.hint}`;
}
function replay() {
  const a = S.q.answer;
  if (a.targets) { if (a.kind === 'seq') Sound.playSeq(a.targets); else if (a.kind === 'chord') Sound.playChord(a.targets); else Sound.play(a.targets[0]); }
  else if (S.q.shown) Sound.play(midiOf(S.q.shown));
}
function finish(ok, extra, noRec) {
  if (!S || S.answered) return;
  S.answered = true;
  const q = S.q, ms = performance.now() - S.t0;
  if (!noRec && q.type !== 'seq') q.ids.forEach(id => Store.rec(id, ok, ms, S.hinted));
  S.i++; S.times.push(ms);
  if (q.kbPrompt) mountStage();
  if (ok) { S.correct++; S.streak++; S.best = Math.max(S.best, S.streak); } else { S.streak = 0; S.missed.push(q); }
  const fb = $('#fb');
  fb.className = 'fb ' + (ok ? 'ok' : 'bad');
  const play = q.answer.targets || q.shown ? '<button class="btn small ghost" id="b-hear">Hear it</button>' : '';
  if (ok) {
    fb.innerHTML = `<span><b>Correct.</b> ${q.type === 'seq' || q.type === 'chord' ? q.explain : q.type === 'interval' ? '<b>' + q.answer.options[q.answer.correct - 1] + '</b>' : NM(q.shown)}${S.hinted ? ' <span class="muted">(hint used)</span>' : ''}</span>${play}`;
  } else {
    fb.innerHTML = `<span><b>Not quite.</b> ${extra ? extra + ' ' : ''}${q.type === 'seq' ? '' : q.explain}</span>${play}`;
  }
  const hear = $('#b-hear'); if (hear) hear.onclick = replay;
  updateHead(); updateTools();
  const fast = S.mode === 'speed';
  if (ok) S.adv = setTimeout(nextQuestion, fast ? 350 : 800);
  else if (fast) S.adv = setTimeout(nextQuestion, 1600);
  else { $('#b-next').hidden = false; $('#b-next').focus({ preventScroll: true }); }
}

// ---- end of round ------------------------------------------------------------------------------
function endSession() {
  const s = S;
  if (!s) return;
  clearInterval(s.timer); clearTimeout(s.adv);
  const n = s.i, acc = n ? s.correct / n : 0;
  const avg = n ? s.times.reduce((a, b) => a + b, 0) / n : 0;
  let newBest = false;
  if (s.mode === 'speed' && !s.smart) newBest = Store.setBest('speed:' + s.L.id, s.correct);
  if (s.mode === 'speed' && s.smart) newBest = Store.setBest('speed:smart', s.correct);
  const L = s.L, next = L && LEVEL[L.id + 1];
  const missed = new Map();
  s.missed.forEach(q => { const k = q.type === 'seq' ? 'line' + Math.random() : q.ids[0]; if (!missed.has(k)) missed.set(k, q); });
  const rows = [...missed.values()].slice(0, 8).map(q => `<li>${q.type === 'seq' ? 'Line: ' + q.explain : NM(q.shown) + (q.clef ? ` <span class="muted">${CLEFS[q.clef].title.toLowerCase()}</span>` : '')}</li>`).join('');
  const ready = L && levelMastery(L) >= 0.6 && next;
  VIEW.innerHTML = `<div class="wrap narrow"><section class="card summary">
    <p class="eyebrow">${s.mode === 'speed' ? 'Speed round' : 'Round'} complete</p>
    <h2>${s.correct} of ${n} correct${newBest ? ' · new best' : ''}</h2>
    <div class="tiles">
      <div><b>${pct(acc)}%</b><span>accuracy</span></div>
      <div><b>${mm(avg) || 0}s</b><span>average time</span></div>
      <div><b>${s.best}</b><span>best streak</span></div>
    </div>
    ${rows ? `<h3>Review these</h3><ul class="missed">${rows}</ul>` : '<p>Clean round. Nothing to review.</p>'}
    ${L ? `<div class="meter"><i style="width:${pct(levelMastery(L))}%"></i></div><small class="muted">Level ${pad2(L.id)} is ${pct(levelMastery(L))}% mastered</small>` : ''}
    <div class="les-nav">
      <button class="btn" id="s-back">All levels</button>
      <button class="btn${ready ? '' : ' primary'}" id="s-again">Go again</button>
      ${ready ? `<button class="btn primary" id="s-next">Level ${pad2(next.id)}: ${next.title}</button>` : ''}
    </div></section></div>`;
  const o = { level: s.smart ? 'smart' : s.L.id, mode: s.mode, filter: s.filter };
  stopSession();
  $('#s-back').onclick = () => go('learn');
  $('#s-again').onclick = () => startSession(o);
  if (ready) $('#s-next').onclick = () => startSession({ level: next.id });
  window.scrollTo(0, 0);
}

// ---- keyboard shortcuts ---------------------------------------------------------------------------
function drillKeydown(e) {
  if (!S || !S.q || e.ctrlKey || e.metaKey || e.altKey) return false;
  if (e.target.closest && e.target.closest('input,select,textarea')) return false;
  const k = e.key, a = S.q.answer;
  if (S.answered) {
    if (k === 'Enter' || k === ' ') { if (S.mode !== 'speed' && !$('#b-next').hidden) { e.preventDefault(); nextQuestion(); return true; } }
    return false;
  }
  if (k === 'h' || k === 'H') { showHint(); return true; }
  if (k === 'l' || k === 'L') { if (S.q.staff) $('#b-guides').click(); return true; }
  if (a.kind !== 'name') return false;
  const p = a.parts;
  if (/^[a-gA-G]$/.test(k) && !p.fixedLetter) { setPad('l', LETTERS.indexOf(k.toUpperCase())); return true; }
  if (p.acc && (k === 'ArrowUp' || k === 'ArrowDown')) {
    const i = p.acc.indexOf(S.sel.acc), j = clamp(i + (k === 'ArrowUp' ? 1 : -1), 0, p.acc.length - 1);
    setPad('a', p.acc[j]); e.preventDefault(); return true;
  }
  if (p.oct && /^\d$/.test(k)) { if ($(`#ans [data-o="${k}"]`)) setPad('o', +k); return true; }
  if (k === 'Enter') { checkName(); return true; }
  return false;
}

/* ---- ui-explore.js ---- */
// ---------------------------------------------------------------------------
// Explore (interactive landmark map) and Progress views.
// ---------------------------------------------------------------------------
const ex = { clef: 'grand', n: parseNote('C4'), nClef: 'treble', acc: 0, guides: true, labels: 'landmarks', kb: null };

function exClefFor(n) { return ex.clef === 'grand' ? (stepOf(n) >= 28 ? 'treble' : 'bass') : ex.clef; }
function exSet(n, clef, play = true) {
  ex.n = n; ex.nClef = clef || exClefFor(n);
  if (play) Sound.play(midiOf(n));
  exRender(false);
}
function explorePick(m) { exSet(noteFromMidi(m, ex.acc < 0)); }

function exInfo() {
  const n = ex.n, m = midiOf(n);
  const hz = 440 * Math.pow(2, (m - 69) / 12);
  const black = isBlackMidi(m);
  const alt = black ? noteFromMidi(m, n.a > 0) : null;
  const r = route(n, ex.nClef, true);
  const toC = Math.abs(stepOf(n) - 28);
  return `<div class="info-main"><div class="info-name">${nameHTML(n)}</div>
      <div class="info-meta">${black && alt && ascii(alt) !== ascii(n) ? `also ${nameHTML(alt)} · ` : ''}MIDI ${m} · ${hz.toFixed(hz < 100 ? 1 : 0)} Hz</div></div>
    <div class="info-route"><b>Landmark route.</b> ${r.answerHTML}${n.a ? ' The accidental moves it one key ' + (n.a > 0 ? 'right' : 'left') + ' of the written line or space.' : ''}
      <span class="muted"> ${toC === 0 ? 'This is Middle C.' : `${toC} ${toC === 1 ? 'letter' : 'letters'} ${stepOf(n) > 28 ? 'above' : 'below'} Middle C.`}</span></div>`;
}
function exRender(full = true) {
  const n = ex.n, clef = ex.nClef;
  const staffMode = ex.clef;
  const extent = staffMode === 'grand' ? { treble: [-4, 13], bass: [-4, 13] } : { [staffMode]: [-6, 14] };
  const item = { n, clef: staffMode === 'grand' ? clef : undefined, state: 'lm', label: plainName(n) };
  Staff.mount($('#ex-staff'), {
    clef: staffMode, cols: [[item]], extent, guides: ex.guides, scale: 1.5, aria: 'Selected note on the staff',
    onPick: (pos, c) => exSet(noteAtPos(pos, c, ex.acc), c),
  });
  $('#ex-info').innerHTML = exInfo();
  if (!ex.kb || full) return;
  ex.kb.clear();
  ex.kb.mark(midiOf(n), 'target');
}
function exKeyboard() {
  const lab = ex.labels;
  ex.kb = Keyboard.mount($('#ex-kb'), { lo: 21, hi: 108, labels: lab, onPress: m => explorePick(m), minKey: 30, maxKey: 44 });
  ex.kb.mark(midiOf(ex.n), 'target');
  ex.kb.scrollTo(midiOf(ex.n));
}
function viewExplore() {
  tab = 'explore'; setNav();
  const chips = LANDMARKS.slice().sort((a, b) => a.midi - b.midi).map(l => `<button class="chip" data-lm="${l.n}"><b>${l.name}</b><span>${l.n}</span></button>`).join('');
  VIEW.innerHTML = `<div class="wrap">
    <h1 class="page-h">Explore</h1>
    <p class="lead">Tap a key, or tap a line or space on the staff. You get the name and the shortest route from a landmark.</p>
    <section class="card ex">
      <div class="toolbar">
        <div class="tb"><span>Clef</span>${seg('exclef', [['grand', 'Grand'], ['treble', 'Treble'], ['bass', 'Bass'], ['alto', 'Alto'], ['tenor', 'Tenor']], ex.clef)}</div>
        <div class="tb"><span>Accidental</span>${seg('exacc', [[-1, '♭'], [0, '♮'], [1, '♯']], ex.acc)}</div>
        <div class="tb"><span>Guides</span>${seg('exguides', [[true, 'On'], [false, 'Off']], ex.guides)}</div>
        <div class="tb"><span>Key labels</span>${seg('exlabels', [['none', 'None'], ['landmarks', 'Landmarks'], ['all', 'All']], ex.labels)}</div>
      </div>
      <div id="ex-staff"></div>
      <div class="info" id="ex-info"></div>
      <div id="ex-kb"></div>
      <div class="kb-nav"><button class="btn small ghost" data-kbnav="-1">‹ Lower keys</button><button class="btn small ghost" data-kbnav="1">Higher keys ›</button></div>
    </section>
    <section class="card"><h3>Landmarks</h3><div class="chips">${chips}</div></section>
  </div>`;
  exKeyboard(); exRender(true);
  VIEW.onclick = e => {
    const chip = e.target.closest('.chip');
    if (chip) { const l = LM[chip.dataset.lm]; exSet(l.note, undefined); return; }
    const nav = e.target.closest('[data-kbnav]');
    if (nav) return ex.kb.scrollBy(+nav.dataset.kbnav);
    const b = e.target.closest('[data-set]');
    if (!b) return;
    const k = b.dataset.set, v = b.dataset.v;
    if (k === 'exclef') { ex.clef = v; ex.nClef = exClefFor(ex.n); }
    if (k === 'exacc') { ex.acc = +v; ex.n = fromStep(stepOf(ex.n), ex.acc); }
    if (k === 'exguides') ex.guides = v === 'true';
    if (k === 'exlabels') ex.labels = v;
    $$('[data-set="' + k + '"]', VIEW).forEach(x => x.setAttribute('aria-checked', String(x === b)));
    if (k === 'exlabels') exKeyboard();
    if (k === 'exacc') Sound.play(midiOf(ex.n));
    exRender(false);
  };
}

// ---- Progress -----------------------------------------------------------------------------------
function idNote(id) {
  const m = /^(treble|bass|alto|tenor):([A-G](?:bb|b|#|x|)-?\d)\*?$/.exec(id);
  if (!m) return null;
  try { return { clef: m[1], n: parseNote(m[2]) }; } catch (e) { return null; }
}
function viewProgress() {
  tab = 'progress'; setNav();
  const d = Store.all();
  const items = d.items;
  const heat = {};
  Object.entries(items).forEach(([id, it]) => {
    const p = idNote(id);
    if (!p || !it.n) return;
    const m = midiOf(p.n);
    heat[m] = Math.max(heat[m] === undefined ? -1 : heat[m], it.b);
  });
  const total = d.totals.q, acc = total ? d.totals.ok / total : 0;
  const days = Object.keys(d.days).length;
  const allStaff = new Map();
  LEVELS.forEach(L => (L.staff || []).forEach(e => allStaff.set(e.id, e)));
  const masteredN = [...allStaff.keys()].filter(id => Store.box(id) >= Store.MASTERED).length;
  const weak = Object.entries(items).map(([id, it]) => ({ id, it, p: idNote(id) }))
    .filter(x => x.p && x.it.n && x.it.b < Store.MASTERED)
    .sort((a, b) => a.it.b - b.it.b || (a.it.c / a.it.n) - (b.it.c / b.it.n) || b.it.ms - a.it.ms).slice(0, 8);
  const lvl = LEVELS.map(L => { const m = levelMastery(L); return `<div class="row lv"><span>${pad2(L.id)} · ${L.title}</span><span class="meter sm"><i style="width:${pct(m)}%"></i></span><b>${pct(m)}%</b></div>`; }).join('');
  VIEW.innerHTML = `<div class="wrap">
    <h1 class="page-h">Progress</h1>
    <div class="tiles big">
      <div><b>${total}</b><span>answers</span></div>
      <div><b>${total ? pct(acc) + '%' : '–'}</b><span>accuracy</span></div>
      <div><b>${masteredN}<small> / ${allStaff.size}</small></b><span>staff notes mastered</span></div>
      <div><b>${days}</b><span>days practiced</span></div>
    </div>
    <section class="card"><h3>Keyboard map</h3><p class="muted">Each key shows how well you read it from the staff. Unplayed keys stay plain.</p>
      <div id="heat"></div>
      <div class="legend"><span><i class="sw h0"></i>shaky</span><span><i class="sw h2"></i>learning</span><span><i class="sw h3"></i>solid</span><span><i class="sw h5"></i>automatic</span></div>
      <div class="kb-nav"><button class="btn small ghost" data-kbnav="-1">‹ Lower keys</button><button class="btn small ghost" data-kbnav="1">Higher keys ›</button></div>
    </section>
    <div class="two">
      <section class="card"><h3>Needs work</h3>${weak.length ? `<ul class="missed">${weak.map(w => `<li>${nameHTML(w.p.n)} <span class="muted">${CLEFS[w.p.clef].title.toLowerCase()} · ${Math.round(100 * w.it.c / w.it.n)}% right</span></li>`).join('')}</ul>` : '<p class="muted">Nothing flagged yet. Do a few drills and your weakest notes will show up here.</p>'}
        ${weak.length ? '<button class="btn small primary" id="p-smart">Practice these</button>' : ''}</section>
      <section class="card"><h3>Levels</h3>${lvl}</section>
    </div>
    <section class="card"><h3>Reset</h3><p class="muted">Erase all progress stored in this browser.</p><div id="reset-zone"><button class="btn small" id="p-reset">Reset progress</button></div></section>
  </div>`;
  const kb = Keyboard.mount($('#heat'), { lo: 21, hi: 108, labels: 'c', minKey: 28, maxKey: 44 });
  Object.entries(heat).forEach(([m, b]) => kb.mark(+m, 'h' + b));
  kb.scrollTo(60);
  VIEW.onclick = e => {
    const nav = e.target.closest('[data-kbnav]');
    if (nav) return kb.scrollBy(+nav.dataset.kbnav);
    if (e.target.id === 'p-smart') return startSession({ level: 'smart' });
    if (e.target.id === 'p-reset') {
      $('#reset-zone').innerHTML = '<p>This cannot be undone.</p><button class="btn small danger" id="p-reset-yes">Erase everything</button> <button class="btn small ghost" id="p-reset-no">Cancel</button>';
    } else if (e.target.id === 'p-reset-no') $('#reset-zone').innerHTML = '<button class="btn small" id="p-reset">Reset progress</button>';
    else if (e.target.id === 'p-reset-yes') { Store.reset(); Questions.reset(); viewProgress(); }
  };
}

/* ---- main.js ---- */
// ---------------------------------------------------------------------------
// Boot: wire navigation, keyboard shortcuts, MIDI routing and the first view.
// ---------------------------------------------------------------------------
const App = {
  /** A piano key was pressed on screen or on a MIDI keyboard. */
  onKey(m, fromMidi) {
    if (S && S.q) {
      if (fromMidi && S.kb) S.kb.flash(m);
      handleKey(m);
    } else {
      Sound.play(m);
      if (tab === 'explore' && fromMidi) explorePick(m);
    }
  },
};

(function boot() {
  applySettings();
  initSettings();
  Sound.setMidiHandler(m => App.onKey(m, true));
  // the interactive machines announce notes (a tapped key, a hammer striking)
  document.addEventListener('anatomy:note', e => Sound.play(e.detail.midi, { vel: e.detail.velocity || 0.7 }));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncIso);
  $('#nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.tab); });
  $('.brand').addEventListener('click', e => { e.preventDefault(); go('learn'); });
  document.addEventListener('pointerdown', () => Sound.ensure(), { once: true });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (!$('#sheet').hidden) return closeSheet();
      if (S) return go('drill');
    }
    if (!$('#sheet').hidden) return;
    if (drillKeydown(e)) return;
    if (lessonState && tab === 'learn' && $('.lesson')) {
      if (e.key === 'ArrowRight' && $('#les-next')) $('#les-next').click();
      if (e.key === 'ArrowLeft' && !$('#les-prev').disabled) $('#les-prev').click();
    }
  });
  window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (TABS.includes(t) && t !== tab) go(t); });
  const first = location.hash.slice(1);
  go(TABS.includes(first) ? first : 'learn');
})();

</script>
