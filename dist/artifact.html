<title>Landmark Piano</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&family=IBM+Plex+Mono:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: a practice-room desk. A pale, cool work surface; the staff and keyboard are the
   instruments and get the most contrast. One cobalt accent marks landmarks everywhere (notes,
   keys, guide lines, buttons) so the colour itself teaches "this is an anchor". Amber marks the
   key or note you are asked about. Green and red are reserved for right and wrong. */
:root {
  --bg: #edf0f4;
  --surface: #ffffff;
  --surface-2: #f4f6f9;
  --ink: #14171d;
  --muted: #5a6371;
  --line: #d8dde5;
  --staff: #232831;
  --accent: #2b4bdb;
  --accent-ink: #ffffff;
  --accent-soft: #e4e9fd;
  --target: #f2b227;
  --target-ink: #b97800;
  --good: #17855a;
  --bad: #c6372e;
  --sel: #9db2ff;
  --key-white: #fcfcfa;
  --key-edge: #b4bac5;
  --key-black: #171a20;
  --key-down: #dfe3ea;
  --key-label: #4b5360;
  --grp2: #d9e3ff;
  --grp3: #ffe7b0;
  --h0: #e5675b; --h1: #ee8a55; --h2: #f2b64d; --h3: #a8d26b; --h4: #5dbe7d; --h5: #2ea66b;
  --display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgba(20, 23, 29, .06), 0 6px 20px rgba(20, 23, 29, .05);
}

  :root:not([data-theme="light"]) {
    --bg: #0e1014; --surface: #171a20; --surface-2: #1e222a; --ink: #eceff4; --muted: #9ba4b2; --line: #2b313b;
    --staff: #c7cdd8; --accent: #7f9cff; --accent-ink: #0b1020; --accent-soft: #1f2a55; --target: #f2b227; --target-ink: #f2b227;
    --good: #41c48b; --bad: #ff7468; --sel: #5a72d6;
    --key-white: #edebe6; --key-edge: #7b8290; --key-black: #0b0c10; --key-down: #c9ccd3; --key-label: #4b5360;
    --grp2: #c6d3f8; --grp3: #f6dda0;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1014; --surface: #171a20; --surface-2: #1e222a; --ink: #eceff4; --muted: #9ba4b2; --line: #2b313b;
  --staff: #c7cdd8; --accent: #7f9cff; --accent-ink: #0b1020; --accent-soft: #1f2a55; --target: #f2b227; --target-ink: #f2b227;
  --good: #41c48b; --bad: #ff7468; --sel: #5a72d6;
  --key-white: #edebe6; --key-edge: #7b8290; --key-black: #0b0c10; --key-down: #c9ccd3; --key-label: #4b5360;
  --grp2: #c6d3f8; --grp3: #f6dda0;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.015em; }
h3 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }

.eyebrow { font: 600 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.nm { font-family: var(--mono); font-weight: 600; white-space: nowrap; }
.nm .acc, svg.acc { display: inline-block; height: 1.05em; width: auto; vertical-align: -0.2em; margin: 0 .03em; fill: currentColor; }

/* ---------- shell ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1000px; margin: 0 auto; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none; font: 750 18px var(--display); letter-spacing: -0.02em; margin-right: auto; }
.logo { width: 30px; height: 30px; color: var(--ink); }
.logo line { stroke: currentColor; stroke-width: 1.4; }
.logo circle { fill: var(--accent); }
#nav { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 12px; border: 1px solid var(--line); }
#nav button { border: 0; background: transparent; padding: 7px 14px; border-radius: 9px; font: 600 14px var(--body); color: var(--muted); }
#nav button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tools { display: flex; gap: 6px; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 22px; line-height: 1; }
.icon-btn svg { width: 20px; height: 20px; fill: currentColor; }
@media (max-width: 640px) {
  #nav { order: 3; flex: 1 1 100%; }
  #nav button { flex: 1; padding: 8px 4px; }
}
.wrap { max-width: 1000px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 56px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
.wrap.narrow { max-width: 860px; }
.page-h { font-size: clamp(26px, 5vw, 34px); font-weight: 750; }
.lead { color: var(--muted); max-width: 62ch; }

/* ---------- buttons, controls ---------- */
.btn { font: 600 14px var(--body); padding: 9px 15px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 11px; font-size: 13px; }
.btn.big { padding: 13px 26px; font-size: 16px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font: 600 13px var(--body); color: var(--muted); }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.meter { height: 6px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.meter.sm { width: 90px; flex: none; }
.row.lv span:first-child { flex: 1; min-width: 0; }
.stars { display: inline-flex; gap: 2px; margin-left: auto; }
.star { width: 15px; height: 15px; fill: var(--line); }
.star.on { fill: var(--target); }

/* ---------- learn ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px; align-items: center; padding: 8px 0 4px; }
.hero-copy { display: flex; flex-direction: column; gap: 14px; }
.hero h1 { font-size: clamp(28px, 4.4vw, 42px); font-weight: 750; }
.hero p { color: var(--muted); max-width: 46ch; }
.hero-chart { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
@media (max-width: 800px) { .hero { grid-template-columns: 1fr; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font: 600 12.5px var(--body); }
.chip:hover { border-color: var(--accent); }
.chip span { font-family: var(--mono); color: var(--accent); margin-left: 6px; }
.tier { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.tier h2 { font-size: 22px; font-weight: 750; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.tier h2 small { font: 400 14px var(--body); color: var(--muted); }
.lvl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 14px; }
.lvl { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.lvl.next { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.lvl-top { display: flex; align-items: center; gap: 8px; }
.lvl-n { font: 600 13px var(--mono); color: var(--muted); }
.badge { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .05em; background: var(--accent); color: var(--accent-ink); padding: 3px 7px; border-radius: 6px; }
.lvl h3 { font-size: 18px; }
.lvl p { color: var(--muted); font-size: 14px; flex: 1; }
.lvl-actions { display: flex; gap: 8px; margin-top: 4px; }

/* ---------- lesson ---------- */
.crumbs { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.lesson h2 { font-size: clamp(22px, 4vw, 28px); font-weight: 750; }
.prose { display: flex; flex-direction: column; gap: 10px; max-width: 64ch; }
.prose ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.viz { display: flex; flex-direction: column; gap: 12px; background: var(--surface-2); border-radius: 12px; padding: 12px; min-width: 0; }
.viz-kb { min-width: 0; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }
.les-nav { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; }

/* ---------- drill ---------- */
.setup { gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; border: 0; padding: 0; margin: 0; }
.field label, .field legend { font: 600 13px var(--body); color: var(--muted); padding: 0; }
.d-head { display: flex; align-items: center; gap: 10px; }
.d-title { flex: 1; font: 700 15px var(--display); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.d-stats { display: flex; gap: 12px; font: 600 13px var(--mono); color: var(--muted); }
.progress { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: -6px; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.q-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.q-text { font: 600 18px/1.35 var(--body); flex: 1; min-width: 200px; }
.q-text.big { font: 750 clamp(30px, 6vw, 44px)/1.1 var(--display); padding: 18px 0; }
.q-tools { display: flex; gap: 6px; }
.q-tools .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.stage { min-width: 0; }
.staff-wrap { margin: 0 auto; width: 100%; }
.staff-svg { display: block; width: 100%; height: auto; }
.fb { min-height: 54px; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; border: 1px solid transparent; font-size: 15px; }
.fb:empty { visibility: hidden; }
.fb.ok { background: color-mix(in srgb, var(--good) 13%, var(--surface)); border-color: var(--good); }
.fb.bad { background: color-mix(in srgb, var(--bad) 11%, var(--surface)); border-color: var(--bad); }
.fb.hint { background: var(--accent-soft); border-color: var(--accent); }
.fb span { min-width: 0; }
.answer { padding: 14px; }
.d-foot { display: flex; justify-content: flex-end; min-height: 42px; }
.kb-nav { display: flex; justify-content: space-between; gap: 8px; }
.pad { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.pad-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
.pad-lbl { font: 600 12px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-right: 4px; }
.pad-note { color: var(--muted); }
.pad-sel { font: 600 18px var(--mono); min-width: 5ch; }
.pbtn { min-width: 54px; height: 54px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font: 700 21px var(--display); display: inline-grid; place-items: center; }
.pbtn.wide { min-width: 96px; font-size: 17px; }
.pbtn:hover { border-color: var(--accent); }
.pbtn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pbtn.good { background: var(--good); border-color: var(--good); color: #fff; }
.pbtn.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
.pbtn .acc { height: 1.3em; }
.summary h2 { font-size: 30px; font-weight: 750; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
.tiles > div { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.tiles b { font: 750 28px var(--display); font-variant-numeric: tabular-nums; }
.tiles b small { font-size: 15px; color: var(--muted); font-weight: 600; }
.tiles span { font-size: 13px; color: var(--muted); }
.missed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.missed li { padding: 8px 0; border-top: 1px solid var(--line); }
.missed li:first-child { border-top: 0; }

/* ---------- explore / progress ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; }
.tb { display: flex; flex-direction: column; gap: 4px; }
.tb > span { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.info { display: grid; grid-template-columns: auto 1fr; gap: 6px 22px; align-items: center; padding: 12px 14px; background: var(--surface-2); border-radius: 12px; }
@media (max-width: 640px) { .info { grid-template-columns: 1fr; } }
.info-name { font: 750 34px var(--mono); line-height: 1.1; }
.info-meta { font: 500 13px var(--mono); color: var(--muted); }
.info-route { font-size: 15px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.sw.h0 { background: var(--h0); } .sw.h2 { background: var(--h2); } .sw.h3 { background: var(--h3); } .sw.h5 { background: var(--h5); }

/* ---------- settings sheet ---------- */
.sheet { position: fixed; inset: 0; z-index: 70; background: rgba(8, 10, 14, .5); display: flex; justify-content: flex-end; }
.sheet-p { width: min(440px, 100%); height: 100%; background: var(--surface); overflow: auto; padding: calc(18px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 18px; display: flex; flex-direction: column; gap: 14px; }
.sheet-h { display: flex; justify-content: space-between; align-items: center; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.set-row > div:first-child { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 180px; }
.set-row small { color: var(--muted); }
input[type="range"] { accent-color: var(--accent); width: 160px; }

/* ---------- staff (svg) ---------- */
.staff-svg .ln, .staff-svg .bar { stroke: var(--staff); stroke-width: 1.1; }
.staff-svg .bar { stroke-width: 1.4; }
.staff-svg .clef, .staff-svg .ksig, .staff-svg .brace { fill: var(--staff); }
.staff-svg .ledger { stroke: var(--staff); stroke-width: 1.4; }
.staff-svg .note { color: var(--ink); pointer-events: none; }
.staff-svg .note path, .staff-svg .note .accg { fill: currentColor; }
.staff-svg .note .stem { stroke: currentColor; stroke-width: 1.3; }
.staff-svg .st-lm { color: var(--accent); }
.staff-svg .st-target { color: var(--target-ink); }
.staff-svg .st-good { color: var(--good); }
.staff-svg .st-bad { color: var(--bad); }
.staff-svg .st-dim { color: var(--muted); }
.staff-svg .ghost { opacity: .45; }
.staff-svg .guide { stroke: var(--accent); stroke-width: 1; stroke-dasharray: 3 3; opacity: .65; }
.staff-svg .guide-lbl { font: 600 9.5px var(--mono); fill: var(--accent); }
.staff-svg .lbl { font: 600 11px var(--mono); fill: var(--muted); }
.staff-svg .ott { fill: none; stroke: var(--staff); stroke-width: 1; stroke-dasharray: 4 3; }
.staff-svg .ott-lbl { font: italic 700 13px var(--body); fill: var(--staff); }
.staff-svg .hit { fill: transparent; cursor: pointer; }
.staff-svg .hit:hover { fill: var(--accent); fill-opacity: .13; }

/* ---------- keyboard (svg) ---------- */
.kb-scroll { overflow-x: auto; padding: 2px 2px 8px; -webkit-overflow-scrolling: touch; }
.kb-inner { margin: 0 auto; }
.kb-svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.kb-svg .wk { fill: var(--key-white); stroke: var(--key-edge); stroke-width: 1; cursor: pointer; }
.kb-svg .bk { fill: var(--key-black); cursor: pointer; }
.kb-svg .wk.g2 { fill: var(--grp2); }
.kb-svg .wk.g3 { fill: var(--grp3); }
.kb-svg .wk.down { fill: var(--key-down); }
.kb-svg .bk.down { fill: #3a404c; }
.kb-svg [data-s="target"] { fill: var(--target); }
.kb-svg [data-s="lm"] { fill: var(--accent); }
.kb-svg [data-s="good"] { fill: var(--good); }
.kb-svg [data-s="bad"] { fill: var(--bad); }
.kb-svg [data-s="sel"] { fill: var(--sel); }
.kb-svg [data-s="h0"] { fill: var(--h0); } .kb-svg [data-s="h1"] { fill: var(--h1); } .kb-svg [data-s="h2"] { fill: var(--h2); }
.kb-svg [data-s="h3"] { fill: var(--h3); } .kb-svg [data-s="h4"] { fill: var(--h4); } .kb-svg [data-s="h5"] { fill: var(--h5); }
.kb-svg .kl { font: 600 11px var(--mono); fill: var(--key-label); cursor: pointer; }
.kb-svg .kl.lm { fill: var(--accent); font-weight: 700; }
.kb-svg .lm-dot { fill: var(--accent); pointer-events: none; }
.kb-svg .kl[data-s="lm"], .kb-svg .kl[data-s="good"], .kb-svg .kl[data-s="bad"], .kb-svg .kl[data-s="h0"], .kb-svg .kl[data-s="h5"] { fill: #fff; }
.kb-svg .kl[data-s="target"], .kb-svg .kl[data-s="sel"], .kb-svg .kl[data-s^="h"] { fill: #14171d; }
.kb-svg .kl[data-s="h0"], .kb-svg .kl[data-s="h5"] { fill: #fff; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

/* ---------- machines (interactive figures) ---------- */
.machine { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.machine-copy { display: flex; flex-direction: column; gap: 8px; max-width: 64ch; }
.machine-copy h2 { font-size: 24px; font-weight: 750; }
.machine-copy p { color: var(--muted); }
.fig { max-width: 860px; width: 100%; margin: 0 auto; --anatomy-card: var(--surface); --anatomy-paper: var(--surface); }
.fig .iso-figure { margin: 8px 0 0; }
.fig .iso-plate { border-radius: 16px; box-shadow: 0 0 0 1px var(--line), var(--shadow); }
.fig .iso-stage { cursor: pointer; touch-action: pan-y; user-select: none; -webkit-user-select: none; outline: none; }
.fig .iso-stage:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 8px; }
.fig .iso-legend { font-size: 13px; color: var(--muted); }
.viz .fig { margin: 0; }

/* ---- figures (Anatomy kit, MIT) ---- */

.iso{

function sideOf(meridian) {

  let last = m - 1;

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {

  const R = right.map((point) => iso(point, P));

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),

function shapeOf(meridian, P, smooth) {

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

    tones.push(bandOf(dot3(normal, L)));

    fills.push(d);

function prismOf(F, polygon, s0, s1, P) {

// The moving parts of the key action, drawn from the model's pose. Used twice: at build time
// for the resting pose, and in the page on every frame. k = iso-kit, G = lathe, M = model.
// Everything lives in lanes along y: lane A (the key, wippen, jack, hammer) is centred on y = 0;
// lane B (damper lever, spoon, wire) sits just in front of it.
const makeParts = (k, G, M) => {
  const C = M.C;
  const LANE = { key: [-12, 12], wippen: [-6, 6], jack: [-3, 3], lever: [3.4, 6.4], shank: [-3, 3], butt: [-4, 4], head: [-7, 7], damper: [-11.6, -6.8], wire: -9.2 };
  const STRINGS = { x: [-100, 150], y: [-3, 0, 3], r: 0.9 };
  const frame = (y0) => G.frameOf([0, y0, 0], [0, 1, 0], [1, 0, 0], [0, 0, 1]);
  const S = (paths, style) => k.solidSvg(paths, style);
  const L = (d, style) => k.lineSvg(d, style);
  const place = (pts, angle, at) => pts.map((p) => M.add(at, M.rot(angle, p)));
  const box = (x0, z0, x1, z1) => [[x0, z0], [x1, z0], [x1, z1], [x0, z1]];
  const prism = (P, pts, [y0, y1]) => G.prismOf(frame(y0), pts, 0, y1 - y0, P);
  /** A disc whose axis runs along y, centred at world (x, z). */

    const F = G.frameAlong([x, y0, z], [0, 1, 0]);
    return { paths: G.disc(0, y1 - y0, r, F, P, style), F, s: y1 - y0 };
  };

  // ---- key, capstan, spoon ----------------------------------------------------------------
  function key(P, pose) {
    const a = -pose.phi, at = C.pivot;
    const out = [];
    out.push(S(prism(P, place([[-135, 0], [185, 0], [190, 3], [190, 12], [184, 14], [-135, 14]], a, at), LANE.key), { tone: "mid" }));
    out.push(S(prism(P, place(box(20, 14, 189, 15.4), a, at), [-12.4, 12.4]), { tone: "hi", crease: "lo" }));
    // key front weight pocket and rear felt
    out.push(S(prism(P, place(box(-135, -1.2, -116, 0), a, at), [-10, 10]), { tone: "lo", crease: "none" }));
    // capstan screw, tilted with the key
    const o = M.onKey(pose.phi, [C.capstan[0], 14]);
    const up = [Math.sin(pose.phi), 0, Math.cos(pose.phi)];
    const F = G.frameAlong([o[0], 0, o[1]], up);
    out.push(S(G.solidOf([[0, 4.6], [2, 4.6], [2, 2.8], [7.6, 2.8], [8.6, 1.8], [9, 0.8]], F, P), { tone: "hi", crease: "lo" }));

    out.push(S(prism(P, place(box(-98, 14, -94, 18), a, at), LANE.damper), { tone: "hi", crease: "lo" }));

  const wippenAt = (pose) => ({ origin: C.wippen, angle: pose.psi });

    const padAt = (lambda) => M.add(M.add(C.wippen, M.rot(pose.psi, hinge)), M.rot(pose.psi + lambda, arm));

    for (let i = 0; i < 30; i++) { const mid = (lo + hi) / 2; if (dist(mid) > 0) lo = mid; else hi = mid; }

  }
  function wippen(P, pose, theta) {
    const { origin, angle } = wippenAt(pose);
    const out = [];
    out.push(S(prism(P, place(box(0, -5, 150, 5), angle, origin), LANE.wippen), { tone: "mid" }));
    out.push(S(prism(P, place(box(41, -5.8, 49, -5), angle, origin), [-5, 5]), { tone: "lo", crease: "none" }));
    // jack cheeks either side of the jack
    for (const lane of [[-5, -3], [3, 5]]) out.push(S(prism(P, place(box(134, 5, 146, 12), angle, origin), lane), { tone: "mid" }));
    // repetition lever
    const lambda = leverTilt(pose, theta);
    const hinge = [116, 10], pad = [C.jackAt + C.toe[0] + C.leverAhead, C.wippenHalf + C.toe[1] - C.lever];

    const tip = M.add(base, M.rot(angle + lambda, M.sub(pad, hinge)));
    const dir = M.sub(tip, base), n = Math.hypot(...dir), u = [dir[0] / n, dir[1] / n], v = [-u[1], u[0]];

    out.push(S(prism(P, poly, LANE.lever), { tone: "mid" }));
    const padCap = M.add(tip, [u[0] * 0.6, u[1] * 0.6]);
    out.push(S(prism(P, [M.add(padCap, [-2.4, -1.1]), M.add(padCap, [2.4, -1.1]), M.add(padCap, [2.4, 0.3]), M.add(padCap, [-2.4, 0.3])], LANE.lever), { tone: "hi", crease: "none" }));

  // ---- jack -------------------------------------------------------------------------------------
  function jack(P, pose) {

    out.push(S(prism(P, place([[-17, 0], [-3, 0], [-3, 3.5], [-17, 3.5]], a, at), LANE.jack), { tone: "mid" }));

    const pin = wheel(P, at, 1.9, [-5.5, 5.5]);
    out.push(S(pin.paths, { tone: "mid" }));
    out.push(ringOn(P, pin, 0.8, 12));
    return out.join("");
  }

  // ---- hammer, roller, head -------------------------------------------------------------------------
  function hammer(P, theta) {
    const at = C.flange, out = [];
    out.push(S(prism(P, place([[-12, -6], [16, -6], [16, 6], [-12, 6]], theta, at), LANE.butt), { tone: "mid" }));
    out.push(S(prism(P, place([[0, -3.5], [C.shank, -2], [C.shank, 2], [0, 3.5]], theta, at), LANE.shank), { tone: "hi", crease: "lo" }));
    const roller = wheel(P, M.rollerAt(theta), C.rollerR, [-4, 4]);
    out.push(S(roller.paths, { tone: "mid" }));
    out.push(ringOn(P, roller, 3.6, 24));
    const head = wheel(P, M.headAt(theta), C.head, LANE.head);
    out.push(S(head.paths, { tone: "hi", crease: "lo", lit: true }));
    out.push(ringOn(P, head, 8, 36));
    out.push(ringOn(P, head, 3.6, 24));

  // ---- strings, with a standing wave after a strike ------------------------------------------------
  function strings(P, wave) {
    const [x0, x1] = STRINGS.x, z = C.stringZ;

        const dz = wave.amp * Math.sin(Math.PI * t) * Math.sin(wave.phase + y * 0.4);
        pts.push(k.iso([x, y, z + dz], P));
      }
      d += k.pathOf(pts);
    }
    return `<path class="iso-line" data-tone="hi" d="${d}" style="stroke-width:1.15"/>`;
  }

  // ---- damper: lever and wire sit behind the main lane, the felt on the strings ------------------
  function damperLow(P, pose) {
    const out = [];
    const at = C.damperPivot, tip = C.damperWire - at[0];
    out.push(S(prism(P, place(box(0, -3, tip + 8, 3), pose.eta, at), LANE.damper), { tone: "mid" }));
    const top = pose.wire[1] + 3;
    const felt = C.stringZ + STRINGS.r + pose.damperLift;
    out.push(S(k.cylinder(pose.wire[0], LANE.wire, 1.1, top, felt + 12 - top, P, 12), { tone: "mid", crease: "none" }));
    return out.join("");
  }
  function damperHead(P, pose) {
    const felt = C.stringZ + STRINGS.r + pose.damperLift, x = pose.wire[0];
    return S(prism(P, [[x - 13, felt], [x + 13, felt], [x + 10, felt + 11], [x - 10, felt + 11]], [-12.8, 5.4]), { tone: "hi", crease: "lo" });
  }

  return { LANE, STRINGS, key, wippen, jack, hammer, strings, damperLow, damperHead, leverTilt };
};

const P = {"origin":[306.6229463852127,348.0295769305309],"scale":1.2905647480476201,"azimuth":79,"elevation":22};
const PARTS = makeParts(k, G, MODEL);
const M = MODEL, C = M.C;
const DIP = C.dip;
const midi = 60;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const SPEEDS = [0.4, 0.08, 1];

function mount(root) {
  const stage = root.querySelector(".iso-stage");
  const svg = stage.querySelector("svg");
  const slots = {};
  ["key", "damperLow", "wippen", "jack", "hammer", "strings", "damperHead"].forEach((n) => (slots[n] = svg.querySelector('[data-part="' + n + '"]')));
  const readout = root.querySelector("[data-readout]");
  const hint = root.querySelector('[data-corner="hint"]');
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const hammer = M.hammer();
  const st = { dip: 0, target: 0, tau: 0.035, speedIdx: 0, drag: false, held: false, wave: { amp: 0, phase: 0 }, status: "", statusAt: 0, sim: 0 };
  let frame = 0, last = 0, visible = false, touring = !still.matches, clock = 0, idle = 0, lastText = "";
  const slow = () => SPEEDS[st.speedIdx];

  const TOUR = [
    { t: 0.5, target: DIP, tau: 0.035 }, { t: 3.1, target: 0, tau: 0.06 },
    { t: 4.6, target: DIP, tau: 0.16 }, { t: 6.6, target: 0, tau: 0.06 },
    { t: 8.0, target: 5.4, tau: 0.05 }, { t: 9.6, target: 0, tau: 0.06 },
    { t: 11.0, target: DIP, tau: 0.012 }, { t: 12.4, target: 5.2, tau: 0.05 }, { t: 12.9, target: DIP, tau: 0.012 }, { t: 14.8, target: 0, tau: 0.06 },
  ];
  const LOOP = 17;

  function status(text) { st.status = text; st.statusAt = st.sim; }
  function advance(dt) {
    // dt is model seconds; the key follows its target, the hammer flies by its own physics
    const n = Math.max(1, Math.ceil(dt / 0.0004)), h = dt / n;
    for (let i = 0; i < n; i++) {

      const pose = M.pose(clamp(st.dip, 0, DIP));
      const before = hammer.phase;
      const r = M.step(hammer, pose, h);
      st.pose = pose;

        status("struck at " + v.toFixed(1) + " m/s");

    slots.wippen.innerHTML = PARTS.wippen(P, pose, hammer.theta);
    slots.jack.innerHTML = PARTS.jack(P, pose);
    slots.hammer.innerHTML = PARTS.hammer(P, hammer.theta);
    slots.strings.innerHTML = PARTS.strings(P, st.wave);
    slots.damperLow.innerHTML = PARTS.damperLow(P, pose);
    slots.damperHead.innerHTML = PARTS.damperHead(P, pose);

  let down = null;
  stage.addEventListener("pointerdown", (event) => {
    try { stage.setPointerCapture(event.pointerId); } catch (error) { /* synthetic events have no active pointer */ }

  });

    if (!down) return;

    if (down.moved) {
      const box = svg.getBoundingClientRect();

  stage.addEventListener("pointercancel", up);

    if (event.repeat) return;
    if (event.key === " " || event.key === "Enter" || event.key === "ArrowDown") { event.preventDefault(); press(event.shiftKey ? 0.2 : 0.032); }
    if (event.key === "s" || event.key === "S") { st.speedIdx = (st.speedIdx + 1) % SPEEDS.length; hint.textContent = hintText(); run(); }
  });
  stage.addEventListener("keyup", (event) => { if (event.key === " " || event.key === "Enter" || event.key === "ArrowDown") release(); });

  hint.textContent = hintText();
  stage.setAttribute("aria-valuetext", "Key up. Press Space to press the key.");
  draw();

/* ---- theory.js ---- */
// ---------------------------------------------------------------------------
// Music theory core. A note is { l: letter 0-6 (C..B), o: octave, a: alteration -2..2 }.
// Optional display flags: hide (accidental comes from the key signature), nat (show a natural sign).
// ---------------------------------------------------------------------------
const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
const PCS = [0, 2, 4, 5, 7, 9, 11];
const INTERVAL_NAMES = ['unison', '2nd', '3rd', '4th', '5th', '6th', '7th', 'octave'];
const ACC_ASCII = { '-2': 'bb', '-1': 'b', '0': '', '1': '#', '2': 'x' };
const ACC_WORDS = { '-2': 'double flat', '-1': 'flat', '0': '', '1': 'sharp', '2': 'double sharp' };
const ACC_GLYPH = { '-2': 'dflat', '-1': 'flat', '0': 'natural', '1': 'sharp', '2': 'dsharp' };

const mk = (l, o, a = 0, extra) => Object.assign({ l, o, a }, extra);
const stepOf = n => n.o * 7 + n.l;
const midiOf = n => 12 * (n.o + 1) + PCS[n.l] + n.a;
const fromStep = (s, a = 0, extra) => mk(((s % 7) + 7) % 7, Math.floor(s / 7), a, extra);
const isBlackMidi = m => [1, 3, 6, 8, 10].includes(((m % 12) + 12) % 12);

function parseNote(str) {
  const m = /^([A-G])(bb|b|#|x|)(-?\d)$/.exec(str);
  if (!m) throw new Error('bad note ' + str);
  return mk(LETTERS.indexOf(m[1]), +m[3], { bb: -2, b: -1, '': 0, '#': 1, x: 2 }[m[2]]);
}
const ascii = n => LETTERS[n.l] + ACC_ASCII[n.a] + n.o;
const letterName = n => LETTERS[n.l] + (n.a ? ' ' + ACC_WORDS[n.a] : '');
const spoken = n => letterName(n) + ' ' + n.o;

const SHARP_SPELL = { 1: [0, 1], 3: [1, 1], 6: [3, 1], 8: [4, 1], 10: [5, 1] };
const FLAT_SPELL = { 1: [1, -1], 3: [2, -1], 6: [4, -1], 8: [5, -1], 10: [6, -1] };
function noteFromMidi(m, flats = false) {
  const pc = ((m % 12) + 12) % 12, oct = Math.floor(m / 12) - 1;
  const w = PCS.indexOf(pc);
  if (w >= 0) return mk(w, oct, 0);
  const [l, a] = (flats ? FLAT_SPELL : SHARP_SPELL)[pc];
  return mk(l, oct, a);
}

/** Inline SVG for an accidental glyph, sized in em so it sits in running text. */
function accSvg(a) {
  const g = GLYPHS[ACC_GLYPH[a]];
  const y0 = -g.b[3], h = g.b[3] - g.b[1];
  return `<svg class="acc" viewBox="0 ${y0} ${g.w} ${h}" style="width:${(g.w / h * 1.05).toFixed(2)}em" aria-hidden="true"><path transform="scale(1 -1)" d="${g.d}" fill="currentColor"/></svg>`;
}
/** Note name as HTML, e.g. F♯4. withOct=false drops the octave number. */
function nameHTML(n, withOct = true) {
  return `<span class="nm">${LETTERS[n.l]}${n.a ? accSvg(n.a) : ''}${withOct ? n.o : ''}</span>`;
}
const accHTML = a => `<span class="nm">${accSvg(a)}</span>`;

// ---- Clefs ----------------------------------------------------------------
// bottom = diatonic step of the bottom line. pos 0 = bottom line, 2 = second line ... 8 = top line.
const CLEFS = {
  treble: { bottom: stepOf(parseNote('E4')), title: 'Treble clef' },
  bass: { bottom: stepOf(parseNote('G2')), title: 'Bass clef' },
  alto: { bottom: stepOf(parseNote('F3')), title: 'Alto clef' },
  tenor: { bottom: stepOf(parseNote('D3')), title: 'Tenor clef' },
};
const posOf = (n, clef) => stepOf(n) - CLEFS[clef].bottom;
const noteAtPos = (pos, clef, a = 0) => fromStep(CLEFS[clef].bottom + pos, a);

// ---- Key signatures ---------------------------------------------------------
const SHARP_ORDER = [3, 0, 4, 1, 5, 2, 6]; // F C G D A E B
const FLAT_ORDER = [6, 2, 5, 1, 4, 0, 3]; // B E A D G C F
const KEYS = {
  0: 'C major', 1: 'G major', 2: 'D major', 3: 'A major', 4: 'E major', 5: 'B major',
  '-1': 'F major', '-2': 'B♭ major', '-3': 'E♭ major', '-4': 'A♭ major', '-5': 'D♭ major',
};
function keyAccs(n) {
  const m = {};
  if (n > 0) SHARP_ORDER.slice(0, n).forEach(l => (m[l] = 1));
  if (n < 0) FLAT_ORDER.slice(0, -n).forEach(l => (m[l] = -1));
  return m;
}
/** A note as written under a key signature. `explicit` (a number) forces an accidental sign. */
function writtenInKey(l, o, keyN, explicit) {
  const km = keyAccs(keyN);
  if (explicit === undefined || explicit === null) return mk(l, o, km[l] || 0, { hide: true });
  return mk(l, o, explicit, explicit === 0 && (km[l] || 0) !== 0 ? { nat: true } : undefined);
}

// ---- Landmarks --------------------------------------------------------------
// The reference set from the grand-staff chart: every C, plus G (treble side) and F (bass side).
const LANDMARKS = [
  { n: 'C1', name: 'Very Low C', tags: ['bass'] },
  { n: 'C2', name: 'Low C', tags: ['bass'] },
  { n: 'F2', name: 'Low F', tags: ['bass'] },
  { n: 'C3', name: 'Bass C', tags: ['bass'] },
  { n: 'F3', name: 'Bass F', core: true, tags: ['bass'] },
  { n: 'C4', name: 'Middle C', core: true, tags: ['treble', 'bass', 'alto', 'tenor'] },
  { n: 'G4', name: 'Treble G', core: true, tags: ['treble'] },
  { n: 'C5', name: 'Treble C', tags: ['treble'] },
  { n: 'G5', name: 'High G', tags: ['treble'] },
  { n: 'C6', name: 'High C', tags: ['treble'] },
  { n: 'C7', name: 'Very High C', tags: ['treble'] },
].map(l => Object.assign(l, { note: parseNote(l.n), step: stepOf(parseNote(l.n)), midi: midiOf(parseNote(l.n)) }));
const LM = Object.fromEntries(LANDMARKS.map(l => [l.n, l]));

function landmarkFor(n, clef) {
  const s = stepOf(n);
  const cClef = clef === 'alto' || clef === 'tenor';
  const relevant = l => (cClef ? l.n === 'C4' : l.core || (clef && l.tags.includes(clef)));
  let best = null;
  for (const l of LANDMARKS) {
    if (clef && !relevant(l)) continue;
    const d = Math.abs(s - l.step);
    const score = d * 10 + (l.core ? 0 : 1) + (clef && l.tags[0] === clef ? -0.5 : 0);
    if (!best || score < best.score) best = { l, d, score };
  }
  return best.l;
}
/** Describe how to reach note n from its nearest landmark. reveal=false hides the letter. */
function route(n, clef, reveal = true) {
  const lm = landmarkFor(n, clef);
  const d = stepOf(n) - lm.step, k = Math.abs(d);
  const dir = d > 0 ? 'up' : 'down';
  const fromTxt = `<b>${lm.name}</b> (${LETTERS[lm.note.l]}${lm.note.o})`;
  let how;
  if (k === 0) how = `That note <i>is</i> the landmark ${fromTxt}.`;
  else if (k === 1) how = `One step ${dir} from ${fromTxt}: line to the next space (or space to the next line).`;
  else if (k === 2) how = `A skip ${dir} from ${fromTxt}: line to line, or space to space (a 3rd).`;
  else how = `${k} steps ${dir} from ${fromTxt} (a ${INTERVAL_NAMES[k] || k + 1 + 'th'}).`;
  const letter = LETTERS[n.l];
  return { lm, d, k, dir, html: how, answerHTML: reveal ? how + ` Count the letters: that gives <b>${letter}</b>.` : how };
}
function stepPhrase(k, dir) {
  if (k === 1) return `one step ${dir}`;
  if (k === 2) return `a skip ${dir} (a 3rd)`;
  return `${k} steps ${dir} (a ${INTERVAL_NAMES[k] || (k + 1) + 'th'})`;
}

// ---- Misc helpers -----------------------------------------------------------
const rnd = n => Math.floor(Math.random() * n);
const pick = arr => arr[rnd(arr.length)];
function weightedPick(items, weightFn) {
  const ws = items.map(weightFn);
  let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const intervalName = (n1, n2) => INTERVAL_NAMES[clamp(Math.abs(stepOf(n1) - stepOf(n2)), 0, 7)] || (Math.abs(stepOf(n1) - stepOf(n2)) + 1) + 'th';

/* ---- store.js ---- */
// ---------------------------------------------------------------------------
// Progress store. Each practised item (a note read in a clef, a key, a key signature...)
// sits in a Leitner-style box 0..5. Boxes drive both what you see next and the mastery bars.
// Persists to localStorage when available, otherwise lives in memory for the session.
// ---------------------------------------------------------------------------
const Store = (() => {
  const KEY = 'landmark-piano:v1';
  const DEFAULTS = {
    sound: true, volume: 0.8, guides: 'auto', hints: true, keyLabels: 'auto', theme: 'auto', length: 20,
  };
  let data = { items: {}, settings: {}, best: {}, days: {}, totals: { q: 0, ok: 0 } };
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) data = Object.assign(data, JSON.parse(raw));
  } catch (e) { /* storage unavailable: keep in memory */ }

  let timer = null;
  function save() {
    clearTimeout(timer);
    timer = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* ignore */ } }, 250);
  }

  const MASTERED = 3;
  const get = id => data.items[id] || null;
  const box = id => (data.items[id] ? data.items[id].b : 0);
  const seen = id => !!(data.items[id] && data.items[id].n);

  function rec(id, ok, ms, hinted) {
    const it = data.items[id] || (data.items[id] = { b: 0, n: 0, c: 0, ms: 0, t: 0 });
    it.n++;
    if (ok) it.c++;
    it.ms = it.ms ? Math.round(it.ms * 0.7 + ms * 0.3) : Math.round(ms);
    it.t = Date.now();
    if (ok) { if (!hinted && ms < 12000) it.b = Math.min(5, it.b + 1); }
    else it.b = Math.max(0, it.b - 2);
    data.totals.q++;
    if (ok) data.totals.ok++;
    const day = new Date().toISOString().slice(0, 10);
    data.days[day] = (data.days[day] || 0) + 1;
    save();
  }
  function weight(id) {
    const it = data.items[id];
    if (!it || !it.n) return 3.2;
    const accPenalty = it.n >= 2 ? (1 - it.c / it.n) * 2 : 0;
    return 0.5 + (5 - it.b) * 0.9 + accPenalty;
  }
  /** Share of the given ids that are mastered (box >= 3). */
  function mastery(ids) {
    if (!ids.length) return 0;
    return ids.filter(id => box(id) >= MASTERED).length / ids.length;
  }
  const started = ids => ids.some(seen);
  function setBest(key, v) { if (v > (data.best[key] || 0)) { data.best[key] = v; save(); return true; } return false; }
  const best = key => data.best[key] || 0;

  const setting = k => (data.settings[k] === undefined ? DEFAULTS[k] : data.settings[k]);
  function setSetting(k, v) { data.settings[k] = v; save(); }
  function reset() { data = { items: {}, settings: data.settings, best: {}, days: {}, totals: { q: 0, ok: 0 } }; save(); }
  return { get, box, seen, rec, weight, mastery, started, setBest, best, setting, setSetting, reset, MASTERED, all: () => data };
})();

/* ---- sound.js ---- */
// ---------------------------------------------------------------------------
// Sound: a small additive piano-ish synth on Web Audio, plus optional Web MIDI input.
// ---------------------------------------------------------------------------
const Sound = (() => {
  let ctx = null, master = null, enabled = true, volume = 0.8;
  let voices = 0;

  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try {
        ctx = new AC();
        const comp = ctx.createDynamicsCompressor();
        master = ctx.createGain();
        master.gain.value = volume * 0.5;
        master.connect(comp);
        comp.connect(ctx.destination);
      } catch (e) { ctx = null; return null; }
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  const PARTIALS = [[1, 1, 1], [2, 0.5, 0.7], [3, 0.26, 0.5], [4, 0.14, 0.38], [5, 0.07, 0.3], [6, 0.04, 0.25]];
  function play(m, o = {}) {
    if (!enabled) return;
    const c = ensure();
    if (!c || voices > 28) return;
    const t = c.currentTime + (o.delay || 0);
    const f = 440 * Math.pow(2, (m - 69) / 12);
    const dur = o.dur || Math.max(0.9, 2.6 - (m - 21) / 45);
    const vel = (o.vel || 0.7) * 0.55;
    const out = c.createGain();
    const lp = c.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = Math.min(9000, f * 6 + 700);
    out.gain.setValueAtTime(0.0001, t);
    out.gain.exponentialRampToValueAtTime(vel, t + 0.005);
    out.gain.exponentialRampToValueAtTime(vel * 0.4, t + 0.35);
    out.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    out.connect(lp);
    lp.connect(master);
    voices++;
    PARTIALS.forEach(([mult, amp, decay], i) => {
      if (f * mult > 12000) return;
      [0, 1.4].forEach(cents => {
        if (i > 0 && cents) return;
        const osc = c.createOscillator();
        const g = c.createGain();
        osc.type = 'sine';
        osc.frequency.value = f * mult;
        osc.detune.value = cents;
        g.gain.setValueAtTime(amp * (cents ? 0.6 : 1), t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur * decay);
        osc.connect(g);
        g.connect(out);
        osc.start(t);
        osc.stop(t + dur + 0.05);
        if (i === 0 && cents) osc.onended = () => { voices--; };
      });
    });
  }
  function playSeq(ms, gap = 0.28) { ms.forEach((m, i) => play(m, { delay: i * gap, dur: 1.2 })); }
  function playChord(ms) { ms.forEach(m => play(m, { dur: 1.8, vel: 0.55 })); }

  // --- MIDI input ---
  let midiAccess = null, midiHandler = null, midiNames = [];
  async function connectMIDI(onNote) {
    midiHandler = onNote;
    if (!navigator.requestMIDIAccess) return { ok: false, msg: 'This browser does not support Web MIDI. Try Chrome or Edge.' };
    try {
      midiAccess = midiAccess || await navigator.requestMIDIAccess();
      const attach = () => {
        midiNames = [];
        midiAccess.inputs.forEach(inp => {
          midiNames.push(inp.name);
          inp.onmidimessage = e => {
            const [s, d1, d2] = e.data;
            if ((s & 0xf0) === 0x90 && d2 > 0 && midiHandler) midiHandler(d1);
          };
        });
      };
      attach();
      midiAccess.onstatechange = attach;
      return midiNames.length
        ? { ok: true, msg: 'Connected: ' + midiNames.join(', ') }
        : { ok: true, msg: 'MIDI is on, but no keyboard was found. Plug one in and it will connect.' };
    } catch (e) {
      return { ok: false, msg: 'MIDI access was blocked. You can still use the on-screen keys.' };
    }
  }
  const setMidiHandler = fn => { midiHandler = fn; };

  return {
    play, playSeq, playChord, ensure, connectMIDI, setMidiHandler,
    get enabled() { return enabled; },
    set enabled(v) { enabled = v; },
    setVolume(v) { volume = v; if (master) master.gain.value = v * 0.5; },
  };
})();

/* ---- staff.js ---- */
// ---------------------------------------------------------------------------
// Staff renderer. Produces an inline SVG string from a description:
//   clef: 'treble' | 'bass' | 'alto' | 'tenor' | 'grand'
//   cols: [[item, ...], ...]  each column is one beat; several items in a column form a chord
//         item = { n: note, clef?, state?, label?, ghost? }
//   keySig: integer (+sharps / -flats), guides: draw landmark labels, extent: { treble:[lo,hi], ... }
//   ottava: { text:'8va', side:'above'|'below', from, to }, onPick: click handler for empty rows
// ---------------------------------------------------------------------------
const Staff = (() => {
  const S = 12, H = S / 2, K = S / 250;
  const CLEF_GLYPH = { treble: ['gClef', 2], bass: ['fClef', 6], alto: ['cClef', 4], tenor: ['cClef', 6] };
  const KS_POS = {
    treble: { sharp: [8, 5, 9, 6, 3, 7, 4], flat: [4, 7, 3, 6, 2, 5, 1] },
    bass: { sharp: [6, 3, 7, 4, 1, 5, 2], flat: [2, 5, 1, 4, 0, 3, -1] },
  };
  const f = v => Math.round(v * 10) / 10;
  const gp = (name, x, y, cls) =>
    `<path${cls ? ` class="${cls}"` : ''} d="${GLYPHS[name].d}" transform="translate(${f(x)} ${f(y)}) scale(${K} ${-K})"/>`;
  const gw = name => GLYPHS[name].w * K;

  function render(o) {
    const grand = o.clef === 'grand';
    const staves = grand ? ['treble', 'bass'] : [o.clef];
    const cols = (o.cols || []).map(col => col.map(it => Object.assign({}, it)));
    const ks = o.keySig || 0;
    const ext = {};
    staves.forEach(c => (ext[c] = { lo: 0, hi: 8 }));

    // Resolve each item's staff and position; grow the vertical extent to fit.
    cols.forEach(col => {
      const chord = col.length > 1;
      col.forEach(it => {
        it.clef = it.clef || (grand ? (stepOf(it.n) >= 28 ? 'treble' : 'bass') : o.clef);
        it.pos = posOf(it.n, it.clef);
        it.whole = o.whole || chord || it.whole;
        const e = ext[it.clef];
        e.lo = Math.min(e.lo, it.pos - 1);
        e.hi = Math.max(e.hi, it.pos + 1);
        if (!it.whole) {
          const up = it.pos < 4;
          if (up) e.hi = Math.max(e.hi, it.pos + 8); else e.lo = Math.min(e.lo, it.pos - 8);
        }
      });
    });
    staves.forEach(c => {
      const x = (o.extent || {})[c];
      if (x) { ext[c].lo = Math.min(ext[c].lo, x[0]); ext[c].hi = Math.max(ext[c].hi, x[1]); }
      if (o.onPick) { ext[c].lo = Math.min(ext[c].lo, -4); ext[c].hi = Math.max(ext[c].hi, 12); }
    });

    // ----- vertical layout -----
    const ottAbove = o.ottava && o.ottava.side === 'above';
    const ottBelow = o.ottava && o.ottava.side === 'below';
    const topPad = 10 + (ottAbove ? 24 : 0);
    const Y = {}; // per clef: y of bottom line (pos 0)
    if (grand) {
      const t = ext.treble, b = ext.bass;
      const top8 = topPad + Math.max(0, t.hi - 8) * H;
      Y.treble = top8 + 8 * H;
      const gap = Math.max(8, Math.max(0, -t.lo) + Math.max(0, b.hi - 8) + 4);
      Y.bass = Y.treble + gap * H + 8 * H;
    } else {
      const c = staves[0];
      Y[c] = topPad + Math.max(0, ext[c].hi - 8) * H + 8 * H;
    }
    const lastC = staves[staves.length - 1];
    const bottomEdge = Y[lastC] + Math.max(0, -ext[lastC].lo) * H;
    const labelRow = cols.some(col => col.some(it => it.label));
    const height = bottomEdge + 10 + (ottBelow ? 24 : 0) + (labelRow ? 18 : 0);
    const topEdge = Y[staves[0]] - 8 * H;
    const yOf = (c, pos) => Y[c] - pos * H;

    // ----- horizontal layout -----
    const x0 = grand ? 34 : 10;
    let x = x0 + 8;
    const clefW = Math.max(...staves.map(c => gw(CLEF_GLYPH[c][0])));
    const clefX = x;
    x += clefW + 8;
    const ksX = x;
    if (ks && KS_POS[staves[0]]) {
      const g = ks > 0 ? 'sharp' : 'flat';
      x += Math.abs(ks) * (gw(g) + 3.5);
    }
    x += 10;
    const colStart = x;
    const nCol = Math.max(1, cols.length);
    const colW = o.colW || (nCol <= 1 ? 130 : 46);
    const area = nCol * colW;
    let x1 = colStart + area + 6;
    if (x1 < 270) x1 = 270;
    const guideW = o.guides ? 72 : 10;
    const width = x1 + guideW;
    const cxOf = i => colStart + (i + 0.5) * (x1 - 6 - colStart) / nCol;

    let svg = '';
    // staff lines
    staves.forEach(c => {
      for (let i = 0; i < 5; i++) {
        const y = yOf(c, i * 2);
        svg += `<line class="ln" x1="${x0}" x2="${x1}" y1="${f(y)}" y2="${f(y)}"/>`;
      }
    });
    // system barline, brace, end barline
    svg += `<line class="bar" x1="${x0}" x2="${x0}" y1="${f(topEdge)}" y2="${f(Y[lastC])}"/>`;
    svg += `<line class="bar" x1="${x1}" x2="${x1}" y1="${f(topEdge)}" y2="${f(Y[lastC])}"/>`;
    if (grand) {
      const sy = (Y.bass - topEdge) / GLYPHS.brace.b[3];
      svg += `<path class="brace" d="${GLYPHS.brace.d}" transform="translate(${x0 - 17} ${f(Y.bass)}) scale(${f(14 / GLYPHS.brace.w)} ${-sy.toFixed(4)})"/>`;
    }
    // clefs and key signature
    staves.forEach(c => {
      const [g, line] = CLEF_GLYPH[c];
      svg += gp(g, clefX, yOf(c, line), 'clef');
      if (ks && KS_POS[c]) {
        const kind = ks > 0 ? 'sharp' : 'flat';
        const ps = KS_POS[c][kind];
        let kx = ksX;
        for (let i = 0; i < Math.abs(ks); i++) {
          svg += gp(kind, kx, yOf(c, ps[i]), 'ksig');
          kx += gw(kind) + 3.5;
        }
      }
    });

    // landmark guides
    if (o.guides) {
      staves.forEach(c => {
        LANDMARKS.forEach(l => {
          if (!l.tags.includes(c)) return;
          const pos = posOf(l.note, c);
          if (pos < ext[c].lo + 0.5 || pos > ext[c].hi - 0.5) return;
          const y = yOf(c, pos);
          const ledger = pos < 0 || pos > 8;
          const xa = ledger ? x1 - 36 : x0;
          svg += `<line class="guide" x1="${xa}" x2="${x1}" y1="${f(y)}" y2="${f(y)}"/>`;
          svg += `<text class="guide-lbl" x="${x1 + 6}" y="${f(y + 3.5)}">${l.name}</text>`;
        });
      });
    }

    // click targets (under the notes)
    let hits = '';
    if (o.onPick) {
      staves.forEach(c => {
        for (let p = ext[c].lo; p <= ext[c].hi; p++) {
          hits += `<rect class="hit" data-clef="${c}" data-pos="${p}" x="${x0}" y="${f(yOf(c, p) - H)}" width="${f(x1 - x0)}" height="${H * 2}"/>`;
        }
      });
    }

    // notes (ledger lines first so heads sit on top)
    let ledSvg = '', noteSvg = '';
    const labelY = height - 6;
    cols.forEach((col, ci) => {
      const cx = cxOf(ci);
      const byClef = {};
      col.forEach(it => (byClef[it.clef] = byClef[it.clef] || []).push(it));
      Object.keys(byClef).forEach(c => {
        const items = byClef[c].slice().sort((a, b) => a.pos - b.pos);
        // displaced seconds
        items.forEach((it, i) => {
          const prev = items[i - 1];
          it.disp = !!(prev && it.pos - prev.pos === 1 && !prev.disp);
        });
        // ledger lines (union across the chord)
        const lo = items[0].pos, hi = items[items.length - 1].pos;
        const hwMax = Math.max(...items.map(it => gw(it.whole ? 'whole' : 'black')));
        const anyDisp = items.some(it => it.disp);
        const lx1 = cx - hwMax / 2 - 4, lx2 = cx + hwMax / 2 + 4 + (anyDisp ? hwMax : 0);
        let led = '';
        for (let q = -2; q >= lo; q -= 2) led += `<line class="ledger" x1="${f(lx1)}" x2="${f(lx2)}" y1="${f(yOf(c, q))}" y2="${f(yOf(c, q))}"/>`;
        for (let q = 10; q <= hi; q += 2) led += `<line class="ledger" x1="${f(lx1)}" x2="${f(lx2)}" y1="${f(yOf(c, q))}" y2="${f(yOf(c, q))}"/>`;
        // accidental columns (stagger when close vertically)
        const accItems = items.filter(it => (it.n.a !== 0 && !it.n.hide) || it.n.nat).sort((a, b) => b.pos - a.pos);
        const accCols = [];
        accItems.forEach(it => {
          let k = accCols.findIndex(last => last - it.pos >= 6);
          if (k < 0) { k = accCols.length; accCols.push(it.pos); } else accCols[k] = it.pos;
          it.accCol = k;
        });
        // draw each note
        items.forEach(it => {
          const hn = it.whole ? 'whole' : 'black';
          const hw = gw(hn);
          const hx = cx - hwMax / 2 + (it.disp ? hwMax : 0) + (hwMax - hw) / 2;
          const y = yOf(c, it.pos);
          let g = '';
          g += gp(hn, hx, y);
          if (!it.whole) {
            const up = it.pos < 4;
            let end = up ? Math.max(it.pos + 7, 4) : Math.min(it.pos - 7, 4);
            const sx = up ? hx + hw - 0.7 : hx + 0.7;
            g += `<line class="stem" x1="${f(sx)}" x2="${f(sx)}" y1="${f(y)}" y2="${f(yOf(c, end))}"/>`;
          }
          if (it.accCol !== undefined) {
            const a = it.n.a !== 0 ? it.n.a : 0;
            const gname = ACC_GLYPH[a];
            const aw = gw(gname);
            const ax = cx - hwMax / 2 - 4 - aw - it.accCol * 14;
            g += gp(gname, ax, y, 'accg');
          }
          const cls = `note st-${it.state || 'ink'}${it.ghost ? ' ghost' : ''}`;
          noteSvg += `<g class="${cls}">${g}</g>`;
          if (it.label) noteSvg += `<text class="lbl" x="${f(cx)}" y="${f(labelY)}" text-anchor="middle">${it.label}</text>`;
        });
        ledSvg += led;
      });
    });

    svg += hits + ledSvg + noteSvg;

    // ottava bracket
    if (o.ottava) {
      const ot = o.ottava;
      const xa = cxOf(ot.from) - 14, xb = cxOf(ot.to) + 16;
      const y = ottAbove ? topPad - 14 : bottomEdge + 18;
      const hook = ottAbove ? 7 : -7;
      svg += `<text class="ott-lbl" x="${f(xa)}" y="${f(y + (ottAbove ? 4 : 4))}">${ot.text}</text>`;
      svg += `<polyline class="ott" points="${f(xa + 30)},${f(y)} ${f(xb)},${f(y)} ${f(xb)},${f(y + hook)}"/>`;
    }

    const aria = o.aria || 'Music staff';
    const html = `<svg class="staff-svg" viewBox="0 0 ${f(width)} ${f(height)}" role="img" aria-label="${aria}" preserveAspectRatio="xMidYMid meet">${svg}</svg>`;
    return { html, w: width, h: height };
  }

  function mount(el, o) {
    const r = render(o);
    el.innerHTML = `<div class="staff-wrap" style="max-width:${Math.round(r.w * (o.scale || 1.5))}px">${r.html}</div>`;
    if (o.onPick) {
      el.querySelector('svg').addEventListener('click', e => {
        const t = e.target.closest('.hit');
        if (t) o.onPick(+t.dataset.pos, t.dataset.clef);
      });
    }
    return r;
  }
  return { render, mount };
})();

/* ---- keyboard.js ---- */
// ---------------------------------------------------------------------------
// On-screen piano keyboard (SVG). Keys carry data-m = MIDI number.
//   mount(el, { lo, hi, labels: 'none'|'c'|'landmarks'|'all', groups, onPress, minKey, maxKey })
// Returns { mark(m, state), clear(), flash(m), scrollTo(m), range }.
// ---------------------------------------------------------------------------
const Keyboard = (() => {
  const WK = 36, KH = 150, BH = 94, BW = 22;
  const BLACK_OFFSET = { 1: -0.08, 3: 0.08, 6: -0.1, 8: 0, 10: 0.1 };
  const LM_BY_MIDI = Object.fromEntries(LANDMARKS.map(l => [l.midi, l]));

  function mount(el, o) {
    let lo = o.lo, hi = o.hi;
    while (isBlackMidi(lo)) lo--;
    while (isBlackMidi(hi)) hi++;
    const whites = [], blacks = [];
    for (let m = lo; m <= hi; m++) (isBlackMidi(m) ? blacks : whites).push(m);
    const widx = {};
    whites.forEach((m, i) => (widx[m] = i));
    const W = whites.length * WK;
    const labels = o.labels || 'none';
    let svg = '';
    whites.forEach(m => {
      const pc = ((m % 12) + 12) % 12;
      const grp = o.groups ? (pc <= 4 ? ' g2' : ' g3') : '';
      svg += `<rect class="wk${grp}" data-m="${m}" x="${widx[m] * WK}" y="0" width="${WK}" height="${KH}" rx="3"/>`;
    });
    // labels and landmark dots
    whites.forEach(m => {
      const pc = ((m % 12) + 12) % 12, l = PCS.indexOf(pc), oct = Math.floor(m / 12) - 1;
      const cx = widx[m] * WK + WK / 2;
      const lm = LM_BY_MIDI[m];
      let txt = '';
      if (labels === 'all') txt = LETTERS[l] + (l === 0 ? oct : '');
      else if (labels === 'c' && l === 0) txt = 'C' + oct;
      else if (labels === 'landmarks' && lm) txt = LETTERS[l] + oct;
      if (labels === 'landmarks' && lm) svg += `<circle class="lm-dot" cx="${cx}" cy="${KH - 38}" r="5"/>`;
      if (txt) svg += `<text class="kl${lm && labels !== 'all' ? ' lm' : ''}" x="${cx}" y="${KH - 10}" text-anchor="middle" data-m="${m}">${txt}</text>`;
    });
    blacks.forEach(m => {
      const pc = ((m % 12) + 12) % 12;
      const below = widx[m - 1];
      const cx = (below + 1) * WK + BLACK_OFFSET[pc] * WK;
      svg += `<rect class="bk" data-m="${m}" x="${cx - BW / 2}" y="0" width="${BW}" height="${BH}" rx="2.5"/>`;
    });

    const minKey = o.minKey || 32, maxKey = o.maxKey || 50;
    el.innerHTML =
      `<div class="kb-scroll"><div class="kb-inner" style="min-width:${whites.length * minKey}px;max-width:${whites.length * maxKey}px">` +
      `<svg class="kb-svg" viewBox="0 0 ${W} ${KH}" role="group" aria-label="Piano keyboard">${svg}</svg></div></div>`;
    const root = el.querySelector('svg');
    const scroller = el.querySelector('.kb-scroll');
    const keyEl = {}, lblEl = {};
    root.querySelectorAll('[data-m]').forEach(k => { if (k.tagName === 'rect') keyEl[k.dataset.m] = k; else lblEl[k.dataset.m] = k; });

    root.addEventListener('pointerdown', e => {
      const t = e.target.closest('[data-m]');
      if (!t) return;
      e.preventDefault();
      const m = +t.dataset.m;
      flash(m);
      if (o.onPress) o.onPress(m);
    });

    function mark(m, state) {
      const k = keyEl[m];
      if (!k) return;
      const l = lblEl[m];
      if (state) { k.setAttribute('data-s', state); if (l) l.setAttribute('data-s', state); }
      else { k.removeAttribute('data-s'); if (l) l.removeAttribute('data-s'); }
    }
    function clear() { Object.values(keyEl).forEach(k => k.removeAttribute('data-s')); Object.values(lblEl).forEach(k => k.removeAttribute('data-s')); }
    function flash(m) {
      const k = keyEl[m];
      if (!k) return;
      k.classList.add('down');
      setTimeout(() => k.classList.remove('down'), 160);
    }
    function scrollTo(m) {
      const k = keyEl[m];
      if (!k) return;
      const inner = el.querySelector('.kb-inner');
      const frac = (+k.getAttribute('x') + WK / 2) / W;
      scroller.scrollLeft = frac * inner.scrollWidth - scroller.clientWidth / 2;
    }
    function scrollBy(dir) { scroller.scrollBy({ left: dir * scroller.clientWidth * 0.7, behavior: 'smooth' }); }
    return { mark, clear, flash, scrollTo, scrollBy, range: [lo, hi], el, scroller };
  }
  return { mount };
})();

/* ---- curriculum.js ---- */
// ---------------------------------------------------------------------------
// Curriculum: 16 levels in four tiers. Each level declares
//   staff  - notes to read from the staff  (entry: { clef, n, id, w?, ott? })
//   keys   - notes to find / name on the keyboard (entry: { n, id })
//   types  - question types and their relative weights
//   pad    - what the "name it" pad asks for ({ letter, acc, oct })
//   steps  - landmark-relative questions ({ from: [landmark names], max })
//   review - earlier levels to blend back in
// Lesson slides live in lessons.js.
// ---------------------------------------------------------------------------
const E = (clef, n, extra) => Object.assign({ clef, n, id: `${clef}:${ascii(n)}${extra && extra.ott ? '*' : ''}` }, extra);
const naturals = (clef, lo, hi) => {
  const out = [];
  for (let s = stepOf(parseNote(lo)); s <= stepOf(parseNote(hi)); s++) out.push(E(clef, fromStep(s)));
  return out;
};
const list = (clef, arr) => arr.map(s => E(clef, parseNote(s)));
const blackSpellings = (loM, hiM) => {
  const out = [];
  for (let m = loM; m <= hiM; m++) if (isBlackMidi(m)) { out.push(noteFromMidi(m, false)); out.push(noteFromMidi(m, true)); }
  return out;
};
const keyEntry = (n, id) => ({ n, id: id || 'k:' + ascii(n) });
const keysOf = (arr, idFn) => arr.map(s => { const n = typeof s === 'string' ? parseNote(s) : s; return keyEntry(n, idFn && idFn(n)); });
const whiteKeys = (lo, hi) => {
  const out = [];
  for (let s = stepOf(parseNote(lo)); s <= stepOf(parseNote(hi)); s++) out.push(fromStep(s));
  return out;
};

// ---- derived data ------------------------------------------------------------
const LEVEL = Object.fromEntries(LEVELS.map(l => [l.id, l]));

function levelClefs(L) {
  if (L.clefs) return L.clefs;
  const s = new Set((L.staff || []).map(e => e.clef));
  if (L.keySigs) L.staffClefs.forEach(c => s.add(c));
  return s.size ? [...s] : ['treble'];
}
/** Staff entries including those blended in from review levels (deduplicated). */
function levelStaff(L, withReview = true) {
  const out = new Map();
  (L.staff || []).forEach(e => out.set(e.id, e));
  if (withReview) (L.review || []).forEach(r => levelStaff(LEVEL[r], true).forEach(e => { if (!out.has(e.id)) out.set(e.id, Object.assign({ review: true }, e)); }));
  if (L.capstone) L.capstone.forEach(r => levelStaff(LEVEL[r], false).forEach(e => { if (!out.has(e.id)) out.set(e.id, Object.assign({ review: true }, e)); }));
  return [...out.values()];
}
function levelPoolIds(L) {
  const ids = new Set();
  (L.staff || []).forEach(e => ids.add(e.id));
  (L.keys || []).forEach(e => ids.add(e.id));
  if (L.keySigs) L.keySigs.forEach(k => L.staffClefs.forEach(c => ids.add(`ks:${k}:${c}`)));
  if (L.shapes) {
    ['2nd', '3rd', '4th', '5th', '6th', '7th', 'octave'].forEach(i => ids.add('int:' + i));
    L.shapes.forEach(s => levelClefs(L).forEach(c => ids.add(`ch:${s}:${c}`)));
  }
  return [...ids];
}
function levelMastery(L) {
  if (L.capstone) {
    const ms = L.capstone.map(i => levelMastery(LEVEL[i]));
    return ms.reduce((a, b) => a + b, 0) / ms.length;
  }
  return Store.mastery(levelPoolIds(L));
}
const levelStarted = L => (L.capstone ? L.capstone.some(i => levelStarted(LEVEL[i])) : Store.started(levelPoolIds(L)));
const starsFor = m => (m >= 0.85 ? 3 : m >= 0.6 ? 2 : m >= 0.3 ? 1 : 0);

/** Keyboard range (MIDI) that contains every answer the level can ask for. */
function levelKbRange(L) {
  let lo = midiOf(parseNote(L.kb[0])), hi = midiOf(parseNote(L.kb[1]));
  const widen = n => { lo = Math.min(lo, n); hi = Math.max(hi, n); };
  levelStaff(L).forEach(e => widen(midiOf(e.n)));
  (L.keys || []).forEach(e => widen(midiOf(e.n)));
  if (L.steps) L.steps.from.forEach(n => { const lm = LM[n]; widen(lm.midi - L.steps.max * 2 - 2); widen(lm.midi + L.steps.max * 2 + 2); });
  return [lo, hi];
}
/** Stable vertical extents per clef so the staff doesn't jump around between questions. */
function levelExtent(L) {
  const ext = {};
  levelStaff(L).forEach(e => {
    const n = e.w || e.n;
    const p = posOf(n, e.clef);
    const x = ext[e.clef] || (ext[e.clef] = [0, 8]);
    x[0] = Math.min(x[0], p - 1); x[1] = Math.max(x[1], p + 1);
  });
  if (L.steps) {
    L.steps.from.forEach(nm => {
      const lm = LM[nm];
      levelClefs(L).forEach(c => {
        if (!lm.tags.includes(c)) return;
        const p = posOf(lm.note, c);
        if (!ext[c]) ext[c] = [0, 8];
        if (p >= -6 && p <= 14) { ext[c][0] = Math.min(ext[c][0], p - 1); ext[c][1] = Math.max(ext[c][1], p + 1); }
      });
    });
  }
  return ext;
}
